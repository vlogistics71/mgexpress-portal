<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver Availability | MG Express Dispatch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/assets/css/driver-availability.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">MG <span>EXPRESS</span> DISPATCH</div>
      <div class="staff-email" id="staffEmail"></div>
    </div>
  </header>

  <main class="container">
    <section class="heading">
      <div>
        <div class="eyebrow">Dispatch Workspace</div>
        <h1>Driver Availability</h1>
        <p class="subhead">Compact live view of available, busy, offline drivers and recent assignment rejection warnings.</p>
      </div>
      <a class="back-link" href="/dashboard.html">Home</a>
    </section>

    <section class="toolbar">
      <label class="search-wrap" for="driverSearchInput">
        <span>Search Drivers</span>
        <input id="driverSearchInput" type="search" placeholder="Name, area, vehicle">
      </label>

      <div class="filter-chips" role="group" aria-label="Availability filter">
        <button class="chip active" type="button" data-filter="all">All</button>
        <button class="chip" type="button" data-filter="available">Available</button>
        <button class="chip" type="button" data-filter="busy">Busy</button>
        <button class="chip" type="button" data-filter="offline">Offline</button>
      </div>

      <button class="refresh-btn" id="refreshDriversBtn" type="button">Refresh</button>
    </section>

    <section class="summary-grid" aria-label="Availability summary">
      <article class="summary-card">
        <div class="summary-label">Total Drivers</div>
        <div class="summary-value" id="summaryTotal">0</div>
      </article>
      <article class="summary-card">
        <div class="summary-label">Available</div>
        <div class="summary-value success" id="summaryAvailable">0</div>
      </article>
      <article class="summary-card">
        <div class="summary-label">Busy</div>
        <div class="summary-value warning" id="summaryBusy">0</div>
      </article>
      <article class="summary-card">
        <div class="summary-label">Offline</div>
        <div class="summary-value muted" id="summaryOffline">0</div>
      </article>
    </section>

    <section class="drivers-panel" aria-live="polite">
      <div class="panel-head">
        <h2>Drivers</h2>
        <div class="panel-meta" id="visibleDriversMeta">0 drivers</div>
      </div>

      <div class="error-banner hidden" id="loadErrorBanner"></div>
      <div class="drivers-grid" id="driversGrid">
        <div class="empty">Loading drivers...</div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="driverDetailsModal" aria-hidden="true">
    <section class="driver-modal" role="dialog" aria-modal="true" aria-labelledby="driverDetailsTitle">
      <div class="modal-head">
        <h3 id="driverDetailsTitle">Driver Details</h3>
        <button class="icon-btn" type="button" data-close-driver-modal>Close</button>
      </div>

      <div class="modal-body" id="driverDetailsBody"></div>

      <div class="modal-foot">
        <button class="btn" type="button" data-close-driver-modal>Close</button>
        <button class="btn" type="button" id="editDriverBtn">Edit Driver</button>
        <button class="btn" type="button" id="viewDriverRouteBtn">View Route</button>
        <button class="btn primary" type="button" id="assignDeliveryBtn">Assign Delivery</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="routePreviewModal" aria-hidden="true">
    <section class="driver-modal" role="dialog" aria-modal="true" aria-labelledby="routePreviewTitle">
      <div class="modal-head">
        <div>
          <h3 id="routePreviewTitle">Driver Route Preview</h3>
          <div class="route-preview-subtitle" id="routePreviewSubtitle"></div>
        </div>
        <button class="icon-btn" type="button" data-close-route-preview-modal>Close</button>
      </div>

      <div class="modal-body" id="routePreviewBody"></div>

      <div class="modal-foot">
        <button class="btn" type="button" data-close-route-preview-modal>Close</button>
        <button class="btn" type="button" id="routePreviewNavigateBtn">Navigate Route</button>
      </div>
    </section>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="/assets/js/route-preview.js"></script>
  <script src="/assets/js/driver-availability.js"></script>
  <script src="/dispatch-menu.js"></script>
</body>
</html>
