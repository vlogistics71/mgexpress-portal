<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Record | MG Express</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="/assets/css/dispatch.css"><link rel="stylesheet" href="/assets/css/customers.css"><style>.wrap{width:min(1000px,calc(100% - 24px));margin:24px auto 70px}.back{display:inline-block;margin-bottom:18px;font-weight:900;color:#064f3b;text-decoration:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #dfe8e4;border-radius:18px;padding:18px}.full{grid-column:1/-1}.meta{color:#68756f;font-size:12px;font-weight:800;text-transform:uppercase}.value{margin-top:5px;font-weight:800;white-space:pre-wrap}.jobs{display:grid;gap:9px;margin-top:12px}.job{display:grid;grid-template-columns:120px 1fr 1fr auto;gap:10px;padding:13px;border:1px solid #dfe8e4;border-radius:14px;color:inherit;text-decoration:none}.notes{width:100%;min-height:120px;padding:12px;border:1px solid #dfe8e4;border-radius:12px}.save{margin-top:10px;padding:11px 16px;border:0;border-radius:12px;background:#087455;color:#fff;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.job{grid-template-columns:1fr}.job div{overflow-wrap:anywhere}}</style></head><body><header class="topbar"><div class="topbar-inner"><div class="brand">MG <span>EXPRESS</span> DISPATCH</div><div class="staff-email" id="staffEmail"></div></div></header><main class="wrap"><a class="back" href="/customer.html">← Customers</a><div id="page"><div class="empty">Loading customer…</div></div></main><script src="/assets/js/config.js"></script><script src="/assets/js/auth.js"></script><script src="/dispatch-menu.js"></script><script>(async()=>{const c=window.mgSupabase,p=document.getElementById('page'),id=new URLSearchParams(location.search).get('id'),esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML},fmt=v=>v?new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';if(!window.MG_AUTH||typeof window.MG_AUTH.requireDispatch!=='function'){location.replace('/index.html');return}const auth=await window.MG_AUTH.requireDispatch();if(!auth)return;document.getElementById('staffEmail').textContent=auth.user?.email||'';if(!id){p.innerHTML='<div class="empty">Customer not found.</div>';return}const [a,b]=await Promise.all([c.from('customers').select('*').eq('id',id).maybeSingle(),c.from('quotes').select('id,job_number,status,scheduled_date,created_at,pickup_address,delivery_address,special_instructions').eq('customer_id',id).order('created_at',{ascending:false})]);if(a.error||!a.data){p.innerHTML='<div class="empty">Unable to load this customer.</div>';return}const x=a.data,j=b.data||[],delivered=j.filter(v=>['delivered','completed'].includes(String(v.status||'').toLowerCase())).length;const addresses=[...new Set([x.default_pickup_address,x.default_delivery_address,...j.flatMap(v=>[v.pickup_address,v.delivery_address])].filter(Boolean))];p.innerHTML=`<div class="heading-row"><div><div class="eyebrow">Customer record</div><h1>${esc(x.company||x.name||'Customer')}</h1><div>${esc(x.company?x.name||'':'')}</div></div><a class="primary-button" href="/request.html?customer_id=${encodeURIComponent(x.id)}">+ Create Job</a></div><section class="stats"><article class="stat-card"><div class="stat-number">${j.length}</div><div class="stat-label">Total Jobs</div></article><article class="stat-card"><div class="stat-number">${delivered}</div><div class="stat-label">Delivered</div></article><article class="stat-card"><div class="stat-number">${j.length-delivered}</div><div class="stat-label">Other Jobs</div></article></section><div class="grid"><section class="card"><h2>Customer Information</h2><div class="meta">Email</div><div class="value">${esc(x.email||'—')}</div><br><div class="meta">Phone</div><div class="value">${esc(x.phone||'—')}</div><br><div class="meta">Customer Since</div><div class="value">${fmt(x.created_at)}</div></section><section class="card"><h2>Saved Locations</h2>${addresses.length?addresses.map(v=>`<div class="value" style="margin-bottom:10px">${esc(v)}</div>`).join(''):'<div class="value">No saved locations yet.</div>'}</section><section class="card full"><h2>Internal Dispatch Notes</h2><textarea class="notes" id="notes">${esc(x.internal_notes||'')}</textarea><button class="save" id="saveNotes">Save Notes</button><span id="noteStatus" style="margin-left:10px"></span></section><section class="card full"><h2>Job History</h2><div class="jobs">${j.length?j.map(v=>`<a class="job" href="/job.html?id=${encodeURIComponent(v.id)}"><strong>${esc(v.job_number||'Job')}</strong><div>${esc(v.pickup_address||'—')} → ${esc(v.delivery_address||'—')}</div><div>${fmt(v.scheduled_date||v.created_at)}</div><strong>${esc(v.status||'new')}</strong></a>`).join(''):'<div class="empty">No jobs yet.</div>'}</div></section></div>`;document.getElementById('saveNotes').onclick=async()=>{const s=document.getElementById('noteStatus'),r=await c.from('customers').update({internal_notes:document.getElementById('notes').value,updated_at:new Date().toISOString()}).eq('id',id);s.textContent=r.error?'Unable to save.':'Saved ✓';};})();</script></body></html>
