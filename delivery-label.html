<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MG Express Delivery Label</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script src="/assets/js/config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#ecefea;color:#111;font-family:Arial,sans-serif}.controls{max-width:8.5in;margin:16px auto 8px;display:flex;gap:8px}.controls button{padding:10px 15px;border:1px solid #123b2e;background:#fff;font-weight:800;cursor:pointer}.label{width:8.5in;min-height:5.5in;margin:0 auto;background:#fff;border:2px solid #111;padding:.28in}.header{display:flex;align-items:center;gap:18px;border-bottom:3px solid #123b2e;padding-bottom:12px}.logo{width:180px;max-height:76px;object-fit:contain;object-position:left center}.title{font-size:28px;font-weight:900}.subtitle{margin-top:4px;color:#444;font-size:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin:18px 0}.row{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:15px;line-height:1.35}.row strong{text-transform:uppercase;font-size:12px;letter-spacing:.04em}.route{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.box{border:1.5px solid #111;padding:12px;min-height:110px}.box h2{margin:0 0 8px;font-size:14px;text-transform:uppercase;color:#123b2e}.address{font-size:16px;line-height:1.4;white-space:pre-line}.notes{border:1.5px solid #111;padding:12px;min-height:78px}.notes h2{margin:0 0 6px;font-size:14px;text-transform:uppercase}.barcode{margin-top:18px;text-align:center}.barcode svg{max-width:100%;height:72px}.footer{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#444}.error{padding:30px;font-weight:800;color:#a00}@page{size:Letter landscape;margin:.3in}@media print{body{background:#fff}.controls{display:none}.label{width:100%;min-height:0;margin:0;border:1.5px solid #111;padding:.2in}.logo{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head>
<body><div class="controls"><button id="printBtn">Print Label</button><button id="backBtn">Back</button></div><main class="label" id="label"><div class="error">Loading delivery label…</div></main>
<script>(async function(){const client=window.mgSupabase,label=document.getElementById('label');const id=new URLSearchParams(location.search).get('id')||'';const esc=value=>{const div=document.createElement('div');div.textContent=value==null?'':String(value);return div.innerHTML};const value=(...items)=>items.find(item=>item!==null&&item!==undefined&&String(item).trim())||'';const formatTime=time=>{if(!time)return'';if(/^\d{2}:\d{2}/.test(String(time))){const [h,m]=String(time).split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}const d=new Date(time);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})};const formatDate=date=>{const d=new Date(date||Date.now());return Number.isNaN(d.getTime())?'':d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'2-digit'})};const address=(prefix,q)=>[q[prefix+'_address'],q[prefix+'_suite_floor']?`Suite/Floor ${q[prefix+'_suite_floor']}`:'',[q[prefix+'_city'],q[prefix+'_state']||'CO',q[prefix+'_zip']].filter(Boolean).join(', ')].filter(Boolean).join('\n');try{if(!client||!id)throw new Error('Missing delivery information.');const session=await client.auth.getSession();if(!session?.data?.session){location.href='/index.html';return}const result=await client.from('quotes').select('*').eq('id',id).maybeSingle();if(result.error)throw result.error;if(!result.data)throw new Error('Delivery not found.');const q=result.data,job=String(value(q.job_number,q.id)),serviceDate=value(q.scheduled_date,q.created_at);const pickupTime=formatTime(value(q.preferred_pickup_time,q.pickup_time,q.pickup_scheduled_at));const deliverTime=formatTime(value(q.preferred_delivery_time,q.delivery_time,q.delivery_scheduled_at,q.scheduled_at));const notes=value(q.delivery_instructions,q.special_instructions,q.package_type,'No special instructions');label.innerHTML=`<header class="header"><img class="logo" src="/assets/images/mg-express-logo-2026.svg" alt="MG Express"><div><div class="title">MG Express Delivery Label</div><div class="subtitle">Professional courier and transportation service</div></div></header><section class="meta"><div class="row"><strong>Job Number</strong><span>${esc(job)}</span></div><div class="row"><strong>Service Date</strong><span>${esc(formatDate(serviceDate))}</span></div><div class="row"><strong>Ready At</strong><span>${esc(pickupTime||'Dispatch confirmed')}</span></div><div class="row"><strong>Deliver By</strong><span>${esc(deliverTime||'Dispatch confirmed')}</span></div><div class="row"><strong>Pieces</strong><span>${esc(value(q.piece_count,q.package_quantity,q.quantity,'1'))}</span></div><div class="row"><strong>Reference</strong><span>${esc(value(q.reference_number,'—'))}</span></div></section><section class="route"><div class="box"><h2>From / Pickup</h2><div class="address"><strong>${esc(value(q.pickup_contact_name,q.company_name,q.customer_name))}</strong>\n${esc(address('pickup',q))}\n${esc(value(q.pickup_contact_phone,''))}</div></div><div class="box"><h2>To / Delivery</h2><div class="address"><strong>${esc(value(q.delivery_contact_name,q.delivery_recipient_name,q.pod_recipient_name))}</strong>\n${esc(address('delivery',q))}\n${esc(value(q.delivery_contact_phone,''))}</div></div></section><section class="notes"><h2>Job Notes</h2><div>${esc(notes)}</div></section><div class="barcode"><svg id="jobBarcode"></svg></div><footer class="footer"><span>Courier / Delivery Service</span><span>migenteexpress.com • 720-640-1160</span></footer>`;JsBarcode('#jobBarcode',job,{format:'CODE128',displayValue:true,fontSize:14,height:55,margin:4})}catch(error){label.innerHTML=`<div class="error">${esc(error.message||'Unable to load delivery label.')}</div>`}document.getElementById('printBtn').addEventListener('click',()=>window.print());document.getElementById('backBtn').addEventListener('click',()=>history.back())})();</script></body></html>
