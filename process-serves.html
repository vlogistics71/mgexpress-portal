<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process Serves | MG Express</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#17221e;font-family:Arial,sans-serif}.topbar{background:#064f3b;color:white;padding:22px}.topbar-inner{max-width:1180px;margin:auto}.brand{font-size:25px;font-weight:900}.brand span{color:#ff665c}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.eyebrow{font-size:13px;font-weight:900;color:#087455;text-transform:uppercase;letter-spacing:.08em}h1{font-size:36px;margin:5px 0}.new{border:0;border-radius:13px;background:#087455;color:white;padding:15px 20px;font-size:16px;font-weight:900;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.panel{background:white;border:1px solid #dfe8e4;border-radius:18px;padding:20px}.num{font-size:30px;font-weight:900;margin-top:7px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tab{white-space:nowrap;border:1px solid #d7e3df;background:white;border-radius:999px;padding:10px 14px;font-weight:800}.empty{text-align:center;padding:50px 15px;color:#66736e}.empty strong{display:block;color:#17221e;font-size:20px;margin-bottom:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}h1{font-size:30px}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand">MG <span>EXPRESS</span> COMMAND CENTER</div></div></header>
<main class="wrap">
<div class="head"><div><div class="eyebrow">Legal Services</div><h1>Process Serves</h1><div>Manage assignments, attempts, service results and Returns of Service.</div></div><button class="new" id="newServe">+ New Serve</button></div>
<section class="stats"><div class="card">Active<div class="num" id="activeCount">0</div></div><div class="card">Served<div class="num" id="servedCount">0</div></div><div class="card">ROS Pending<div class="num" id="rosCount">0</div></div><div class="card">Completed<div class="num" id="completeCount">0</div></div></section>
<section class="panel"><div class="tabs"><button class="tab">Active Serves</button><button class="tab">Attempts</button><button class="tab">Served</button><button class="tab">Unserved</button><button class="tab">ROS Pending</button><button class="tab">Completed</button></div><div class="empty"><strong>No process serves yet</strong>Create your first serve assignment to get started.</div></section>
</main>
<script src="dispatch-menu.js"></script>
<script>document.getElementById("newServe").addEventListener("click",()=>alert("New Process Serve form is the next build step."));</script>
</body></html>
