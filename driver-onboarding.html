<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Onboarding | MG Express Dispatch</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#17221e}.topbar{background:#064f3b;color:#fff}.topbar-inner{max-width:1180px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px}.brand span{color:#ff665c}.container{max-width:1180px;margin:auto;padding:30px 20px 70px}.eyebrow{color:#b52a2d;text-transform:uppercase;letter-spacing:.11em;font-size:12px;font-weight:900}h1{margin:7px 0 6px;font-size:34px}.sub{margin:0 0 24px;color:#68736e}.layout{display:grid;grid-template-columns:320px 1fr;gap:18px}.panel{background:#fff;border:1px solid #dde7e2;border-radius:18px;box-shadow:0 8px 24px rgba(20,40,30,.05)}.list-head{padding:16px;border-bottom:1px solid #e6ece9}.list-head input{width:100%;padding:11px 12px;border:1px solid #ccd6d1;border-radius:11px}.driver-list{max-height:70vh;overflow:auto;padding:8px}.driver-item{width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:12px;cursor:pointer}.driver-item:hover,.driver-item.active{background:#eaf5f0}.driver-item b{display:block;font-size:15px}.driver-item span{display:block;margin-top:4px;color:#6d7772;font-size:12px}.content{padding:20px}.empty{padding:30px;text-align:center;color:#6d7772}.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 18px}.status-card{padding:13px;border-radius:13px;background:#f5f8f6;border:1px solid #e1e8e4}.status-card b{display:block;color:#064f3b;font-size:12px;margin-bottom:4px}.status-good{background:#e8f8ee;border-color:#bfe3cc}.status-warn{background:#fff7e7;border-color:#edd9a2}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid label{font-size:12px;font-weight:900;color:#53615c}.form-grid input,.form-grid select,.form-grid textarea{width:100%;margin-top:6px;padding:11px 12px;border:1px solid #cfd9d4;border-radius:11px;background:#fff;font:inherit}.wide{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:11px;padding:12px 15px;background:#064f3b;color:#fff;font-weight:900;cursor:pointer}.btn.secondary{background:#edf3f0;color:#064f3b}.message{margin-top:14px;padding:11px 12px;border-radius:10px;display:none}.message.ok{display:block;background:#e9f8ef;color:#0c7045}.message.error{display:block;background:#fff0f0;color:#9b2929}@media(max-width:820px){.layout{grid-template-columns:1fr}.driver-list{max-height:260px}.status-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.container{padding:24px 14px 55px}}</style></head><body><header class="topbar"><div class="topbar-inner"><div class="brand">MG <span>EXPRESS</span> DISPATCH</div><div id="staffEmail"></div></div></header><main class="container"><div class="eyebrow">Drivers</div><h1>Driver Onboarding</h1><p class="sub">Set up hired drivers and check Driver Portal activation.</p><div class="layout"><section class="panel"><div class="list-head"><input id="search" type="search" placeholder="Search hired drivers"></div><div id="driverList" class="driver-list"><div class="empty">Loading hired drivers…</div></div></section><section class="panel content"><div id="emptyState" class="empty">Select a hired driver to begin onboarding.</div><div id="editor" hidden><div class="status-grid"><div class="status-card"><b>Portal Invite</b><span id="inviteStatus">—</span></div><div class="status-card" id="activationCard"><b>Portal Status</b><span id="portalStatus">—</span></div><div class="status-card"><b>Driver Account</b><span id="accountStatus">—</span></div></div><div class="form-grid"><label>Driver Name<input id="fullName" disabled></label><label>Email<input id="email" disabled></label><label>Driver ID<input id="driverCode" placeholder="MG-1001"></label><label>Start Date<input id="startDate" type="date"></label><label>Service Area<input id="serviceArea" placeholder="Denver / Front Range"></label><label>Vehicle Type<select id="vehicleType"><option>Car</option><option>SUV</option><option>Minivan</option><option>Cargo Van</option><option>Sprinter Van</option></select></label><label class="wide">Vehicle Year / Make / Model<input id="vehicleDetails"></label><label>Driver Status<select id="active"><option value="true">Active</option><option value="false">Inactive</option></select></label><label>Phone<input id="phone" disabled></label><label class="wide">Internal Dispatch Notes<textarea id="internalNotes" rows="4" placeholder="Internal notes only"></textarea></label></div><div class="actions"><button class="btn" id="saveBtn" type="button">Save Driver Setup</button><a class="btn secondary" href="/driver-applications.html" style="text-decoration:none">Driver Applications</a><a class="btn secondary" href="/driver.html" style="text-decoration:none">Driver Availability</a></div><div id="message" class="message"></div></div></section></div></main><script>const client=supabase.createClient('https://dczlucwfjayymlwbzzdi.supabase.co','sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI');window.mgDispatchClient=client;const MARKER='[DRIVER_APPLICATION]';const state={items:[],selected:null};const list=document.getElementById('driverList'),search=document.getElementById('search'),editor=document.getElementById('editor'),empty=document.getElementById('emptyState'),message=document.getElementById('message');function text(v){return String(v||'').trim()}function unpack(v,k){const p=text(v).split('||').find(x=>x.startsWith(k+'='));if(!p)return'';try{return decodeURIComponent(p.slice(k.length+1))}catch{return p.slice(k.length+1)}}function hired(row){return unpack(row.service_area,'H').toLowerCase()==='hired'}function name(row){return row.full_name||row.display_name||row.name||'Driver'}function renderList(){const q=search.value.trim().toLowerCase();const rows=state.items.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q)||name(r).toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(r=>`<button class="driver-item ${state.selected===String(r.id)?'active':''}" data-id="${r.id}"><b>${name(r)}</b><span>${r.email||''}</span></button>`).join(''):'<div class="empty">No hired drivers found.</div>'}async function authHeaders(){const {data:{session}}=await client.auth.getSession();if(!session){location.replace('/index.html');throw new Error('Not signed in')}document.getElementById('staffEmail').textContent=session.user?.email||'';return{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'}}async function load(){await authHeaders();const {data,error}=await client.from('drivers').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<div class="empty">'+error.message+'</div>';return}state.items=(data||[]).filter(r=>hired(r)&&text(r.service_area).includes(MARKER));renderList();window.dispatchEvent(new CustomEvent('mg-dispatch-ready',{detail:{email:document.getElementById('staffEmail').textContent}}))}async function openDriver(id){state.selected=String(id);renderList();message.className='message';message.textContent='';empty.hidden=true;editor.hidden=false;const headers=await authHeaders();const res=await fetch('/api/driver-onboarding?application_id='+encodeURIComponent(id),{headers});const data=await res.json();if(!res.ok){message.className='message error';message.textContent=data.error||'Unable to load driver';return}document.getElementById('fullName').value=data.full_name||'';document.getElementById('email').value=data.email||'';document.getElementById('phone').value=data.phone||'';document.getElementById('driverCode').value=data.driver_code||'';document.getElementById('startDate').value=data.start_date||'';document.getElementById('serviceArea').value=data.service_area||'';document.getElementById('vehicleType').value=data.vehicle_type||'Car';document.getElementById('vehicleDetails').value=data.vehicle_details||'';document.getElementById('internalNotes').value=data.internal_notes||'';document.getElementById('active').value=String(Boolean(data.active));document.getElementById('inviteStatus').textContent=data.invite_sent_at?'Sent '+new Date(data.invite_sent_at).toLocaleString():'Not sent';document.getElementById('portalStatus').textContent=data.portal_status==='activated'?'Activated':data.portal_status==='invited'?'Invite sent — waiting for activation':data.portal_status==='invite_pending'?'Invite pending':'Not invited';document.getElementById('accountStatus').textContent=data.portal_driver_id?'Portal driver record ready':'Portal driver record not created';const card=document.getElementById('activationCard');card.className='status-card '+(data.portal_status==='activated'?'status-good':'status-warn')}async function save(){if(!state.selected)return;const btn=document.getElementById('saveBtn');btn.disabled=true;message.className='message';message.textContent='';try{const headers=await authHeaders();const payload={application_id:state.selected,driver_code:document.getElementById('driverCode').value,start_date:document.getElementById('startDate').value,service_area:document.getElementById('serviceArea').value,vehicle_type:document.getElementById('vehicleType').value,vehicle_details:document.getElementById('vehicleDetails').value,active:document.getElementById('active').value==='true',internal_notes:document.getElementById('internalNotes').value};const res=await fetch('/api/driver-onboarding',{method:'POST',headers,body:JSON.stringify(payload)});const data=await res.json();if(!res.ok)throw new Error(data.error||'Unable to save');message.className='message ok';message.textContent='Driver setup saved.';await openDriver(state.selected)}catch(e){message.className='message error';message.textContent=e.message}finally{btn.disabled=false}}list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openDriver(b.dataset.id)});search.addEventListener('input',renderList);document.getElementById('saveBtn').addEventListener('click',save);load();</script><script src="/dispatch-menu.js"></script></body></html>
