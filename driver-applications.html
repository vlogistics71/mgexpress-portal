<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver Applications | MG Express Dispatch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#17221e}
    .topbar{background:#064f3b;color:#fff}.topbar-inner{max-width:1180px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px}.brand span{color:#ff665c}
    .container{max-width:1180px;margin:auto;padding:34px 22px 70px}.eyebrow{color:#b52a2d;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:900}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.heading h1{margin:7px 0 5px;font-size:36px}.subhead{margin:0;color:#69736f}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.toolbar input{flex:1;min-width:230px;padding:12px 14px;border:1px solid #ccd6d1;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 16px;background:#064f3b;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.approve{background:#157347}.btn.deny{background:#b4232a}.btn.secondary{background:#edf3f0;color:#064f3b}.count{margin:0 0 14px;color:#65706b;font-size:14px}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.filter{border:1px solid #d0dad5;background:#fff;color:#41504a;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:800;cursor:pointer}.filter.active{background:#064f3b;color:#fff;border-color:#064f3b}
    .list{display:grid;grid-template-columns:1fr;gap:11px}.app-card{background:#fff;border:1px solid #dfe7e3;border-radius:16px;box-shadow:0 7px 20px rgba(20,40,30,.045);overflow:hidden;transition:.18s ease}.app-card.status-approved{border-color:#8bc7a8;background:#f1fbf5}.app-card.status-denied{border-color:#e4a3a7;background:#fff4f4}.app-card.status-pending{border-color:#dfe7e3;background:#fff}
    .app-summary{width:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(110px,.75fr) minmax(110px,.75fr) auto auto;gap:14px;align-items:center;border:0;background:transparent;padding:15px 18px;text-align:left;color:inherit;cursor:pointer}.app-summary:hover{background:rgba(6,79,59,.025)}.summary-name{font-size:18px;font-weight:900;min-width:0}.summary-name small{display:block;margin-top:3px;color:#7a8580;font-size:12px;font-weight:600}.summary-cell{font-size:13px;color:#53615c;min-width:0}.summary-cell b{display:block;margin-bottom:2px;color:#064f3b;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:82px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;text-transform:capitalize}.badge.pending{background:#edf1ef;color:#5f6c66}.badge.approved{background:#dff5e8;color:#0d7a45}.badge.denied{background:#f9dfe1;color:#a31f27}.chevron{font-size:20px;font-weight:900;color:#63706b;transition:transform .18s ease}.app-card.open .chevron{transform:rotate(180deg)}
    .app-details{display:none;padding:0 18px 18px}.app-card.open .app-details{display:block}.details-inner{border-top:1px solid rgba(110,130,120,.18);padding-top:17px}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px 18px}.detail{font-size:13px;overflow-wrap:anywhere}.detail b{display:block;color:#064f3b;margin-bottom:3px;font-size:12px}.notes{margin-top:16px;padding:13px 14px;border-radius:12px;background:rgba(255,255,255,.76);border:1px solid rgba(110,130,120,.16);font-size:13px;line-height:1.5;color:#58625e;white-space:pre-wrap}.contact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.contact a{padding:10px 13px;border-radius:10px;background:#edf4f0;color:#064f3b;text-decoration:none;font-size:13px;font-weight:800}.decision-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px;padding-top:16px;border-top:1px solid rgba(110,130,120,.18)}.decision-message{align-self:center;margin-left:auto;font-size:12px;font-weight:800;color:#68736e}
    .empty{padding:32px;background:#fff;border:1px dashed #cbd6d0;border-radius:18px;color:#6d7772;text-align:center}.error{padding:14px;border-radius:12px;background:#fff0f0;color:#9b2929;margin-bottom:16px}.hidden{display:none}
    @media(max-width:850px){.app-summary{grid-template-columns:minmax(0,1fr) auto auto}.summary-cell{display:none}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:720px){.heading{align-items:start;flex-direction:column}.heading h1{font-size:29px}.container{padding:25px 14px 55px}.topbar-inner{padding:16px 14px}.app-summary{padding:14px}.app-details{padding:0 14px 14px}.summary-name{font-size:17px}.badge{min-width:76px;padding:6px 9px}.detail-grid{grid-template-columns:1fr 1fr}.decision-message{width:100%;margin-left:0}.toolbar input{min-width:0;width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand">MG <span>EXPRESS</span> DISPATCH</div><div id="staffEmail"></div></div></header>
  <main class="container">
    <section class="heading"><div><div class="eyebrow">Drivers</div><h1>Driver Applications</h1><p class="subhead">Applications submitted from the MG Express website.</p></div><a class="btn" href="/driver.html" style="text-decoration:none">← Driver Availability</a></section>
    <div class="toolbar"><input id="search" type="search" placeholder="Search name, city, vehicle, work area"><button class="btn" id="refresh" type="button">Refresh</button></div>
    <div class="filters" id="filters">
      <button class="filter active" type="button" data-filter="all">All</button>
      <button class="filter" type="button" data-filter="pending">Pending</button>
      <button class="filter" type="button" data-filter="approved">Approved</button>
      <button class="filter" type="button" data-filter="denied">Denied</button>
    </div>
    <div id="error" class="error hidden"></div><div id="count" class="count">Loading applications…</div><section id="grid" class="list"><div class="empty">Loading applications…</div></section>
  </main>
  <script>
    const client = supabase.createClient('https://dczlucwfjayymlwbzzdi.supabase.co','sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI');
    window.mgDispatchClient = client;
    const state={items:[],filter:'all',openIds:new Set(),savingIds:new Set()};
    const MARKER='[DRIVER_APPLICATION]';
    const LEGACY_CUTOFF=new Date('2026-08-21T18:00:00Z').getTime();
    const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),errorBox=document.getElementById('error');
    function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
    function text(v){return String(v||'').trim()}
    function noteText(row){return String(row.notes||row.internal_notes||row.dispatch_notes||'')}
    function getLine(textValue,label){const line=textValue.split('\n').find(x=>x.toLowerCase().startsWith(label.toLowerCase()+':'));return line?line.slice(line.indexOf(':')+1).trim():''}
    function unpack(value,key){const part=text(value).split('||').find(x=>x.startsWith(key+'='));if(!part)return'';try{return decodeURIComponent(part.slice(key.length+1))}catch(_e){return part.slice(key.length+1)}}
    function stripMarker(value){return text(value).split('||')[0].replace(MARKER,'').trim()}
    function isLegacyApplication(row){const created=new Date(row.created_at||0).getTime();const inactive=row.active===false||row.is_active===false||row.enabled===false;return created>=LEGACY_CUTOFF&&inactive&&text(row.email)&&(text(row.phone)||text(row.mobile_phone))&&text(row.vehicle_make_model)}
    function isApplication(row){return noteText(row).includes(MARKER)||text(row.vehicle_make_model).includes(MARKER)||text(row.service_area).includes(MARKER)||text(row.status).toLowerCase()==='applicant'||isLegacyApplication(row)}
    function decision(row){const packed=unpack(row.service_area,'D').toLowerCase();if(['approved','denied','pending'].includes(packed))return packed;const fromNotes=getLine(noteText(row),'Decision').toLowerCase();if(['approved','denied','pending'].includes(fromNotes))return fromNotes;return'pending'}
    function setPacked(value,key,newValue){const parts=text(value).split('||').filter(Boolean);const encoded=encodeURIComponent(newValue);let found=false;const next=parts.map(part=>{if(part.startsWith(key+'=')){found=true;return key+'='+encoded}return part});if(!found)next.push(key+'='+encoded);return next.join('||')}
    function displayData(row){const notes=noteText(row);const vehicleField=text(row.vehicle_make_model);const serviceField=text(row.service_area);return{status:decision(row),name:row.full_name||row.display_name||row.name||'Applicant',phone:row.phone||row.mobile_phone||'',email:row.email||'',residence:row.current_area||row.area||row.city||getLine(notes,'Residence')||unpack(vehicleField,'R'),vehicle:stripMarker(vehicleField)||getLine(notes,'Vehicle'),type:row.vehicle_type||row.vehicle||getLine(notes,'Vehicle Type'),area:stripMarker(serviceField)||getLine(notes,'Preferred Work Area'),availability:getLine(notes,'Availability')||unpack(vehicleField,'A'),experience:getLine(notes,'Courier / Delivery Experience')||unpack(vehicleField,'E'),license:getLine(notes,"Valid Driver's License")||unpack(vehicleField,'L'),insurance:getLine(notes,'Current Auto Insurance')||unpack(vehicleField,'I'),submitted:getLine(notes,'Submitted')||unpack(serviceField,'S'),applicantNotes:getLine(notes,'Applicant Notes')||unpack(serviceField,'N')}}
    function render(){const q=search.value.trim().toLowerCase();let rows=state.items.filter(row=>{const data=displayData(row);if(state.filter!=='all'&&data.status!==state.filter)return false;if(!q)return true;return JSON.stringify({...row,...data}).toLowerCase().includes(q)});const totals={pending:0,approved:0,denied:0};state.items.forEach(row=>totals[decision(row)]++);document.querySelectorAll('.filter').forEach(btn=>{const f=btn.dataset.filter;const base=f==='all'?state.items.length:totals[f];btn.textContent=`${f.charAt(0).toUpperCase()+f.slice(1)} (${base})`;btn.classList.toggle('active',f===state.filter)});count.textContent=`${rows.length} application${rows.length===1?'':'s'} shown`;if(!rows.length){grid.innerHTML='<div class="empty">No driver applications found.</div>';return}grid.innerHTML=rows.map(row=>{const d=displayData(row),open=state.openIds.has(String(row.id)),saving=state.savingIds.has(String(row.id));const submitted=d.submitted?new Date(d.submitted).toLocaleString():'Website application';return `<article class="app-card status-${esc(d.status)} ${open?'open':''}" data-id="${esc(row.id)}"><button class="app-summary" type="button" data-toggle="${esc(row.id)}"><div class="summary-name">${esc(d.name)}<small>${esc(submitted)}</small></div><div class="summary-cell"><b>Vehicle</b>${esc(d.type||d.vehicle||'—')}</div><div class="summary-cell"><b>Preferred Area</b>${esc(d.area||'—')}</div><span class="badge ${esc(d.status)}">${esc(d.status)}</span><span class="chevron">⌄</span></button><div class="app-details"><div class="details-inner"><div class="detail-grid"><div class="detail"><b>Residence</b>${esc(d.residence||'—')}</div><div class="detail"><b>Preferred Area</b>${esc(d.area||'—')}</div><div class="detail"><b>Vehicle Type</b>${esc(d.type||'—')}</div><div class="detail"><b>Vehicle</b>${esc(d.vehicle||'—')}</div><div class="detail"><b>Availability</b>${esc(d.availability||'—')}</div><div class="detail"><b>Experience</b>${esc(d.experience||'—')}</div><div class="detail"><b>Valid License</b>${esc(d.license||'—')}</div><div class="detail"><b>Auto Insurance</b>${esc(d.insurance||'—')}</div></div>${d.applicantNotes?`<div class="notes"><b>Applicant Notes</b><br>${esc(d.applicantNotes)}</div>`:''}<div class="contact">${d.phone?`<a href="tel:${esc(d.phone)}">Call ${esc(d.phone)}</a>`:''}${d.email?`<a href="mailto:${esc(d.email)}">Email ${esc(d.email)}</a>`:''}</div><div class="decision-row"><button class="btn approve" type="button" data-decision="approved" data-id="${esc(row.id)}" ${saving?'disabled':''}>✓ Approve</button><button class="btn deny" type="button" data-decision="denied" data-id="${esc(row.id)}" ${saving?'disabled':''}>✕ Deny</button><div class="decision-message">Current status: ${esc(d.status)}</div></div></div></div></article>`}).join('')}
    async function saveDecision(id,newDecision){const row=state.items.find(item=>String(item.id)===String(id));if(!row||state.savingIds.has(String(id)))return;state.savingIds.add(String(id));render();errorBox.classList.add('hidden');try{const updatedService=setPacked(row.service_area,'D',newDecision);const {error}=await client.from('drivers').update({service_area:updatedService}).eq('id',row.id);if(error)throw error;row.service_area=updatedService;state.openIds.add(String(id));render()}catch(error){errorBox.textContent='Unable to update application status: '+(error.message||'Unknown error');errorBox.classList.remove('hidden');render()}finally{state.savingIds.delete(String(id));render()}}
    async function migrateLegacyMarkers(rows){for(const row of rows.filter(isLegacyApplication)){if(text(row.vehicle_make_model).includes(MARKER))continue;try{await client.from('drivers').update({vehicle_make_model:`${MARKER} ${text(row.vehicle_make_model)}`}).eq('id',row.id)}catch(_error){}}}
    async function load(){errorBox.classList.add('hidden');grid.innerHTML='<div class="empty">Loading applications…</div>';const {data:{session}}=await client.auth.getSession();if(!session){location.replace('/index.html');return}document.getElementById('staffEmail').textContent=session.user?.email||'';const {data,error}=await client.from('drivers').select('*').order('created_at',{ascending:false});if(error){errorBox.textContent=error.message;errorBox.classList.remove('hidden');grid.innerHTML='<div class="empty">Unable to load applications.</div>';return}state.items=(data||[]).filter(isApplication);render();migrateLegacyMarkers(state.items);window.dispatchEvent(new CustomEvent('mg-dispatch-ready',{detail:{email:session.user?.email||''}}))}
    grid.addEventListener('click',event=>{const toggle=event.target.closest('[data-toggle]');if(toggle){const id=String(toggle.dataset.toggle);state.openIds.has(id)?state.openIds.delete(id):state.openIds.add(id);render();return}const action=event.target.closest('[data-decision]');if(action){event.stopPropagation();saveDecision(action.dataset.id,action.dataset.decision)}});
    document.getElementById('filters').addEventListener('click',event=>{const btn=event.target.closest('[data-filter]');if(!btn)return;state.filter=btn.dataset.filter;render()});
    search.addEventListener('input',render);document.getElementById('refresh').addEventListener('click',load);load();
  </script>
  <script src="/dispatch-menu.js"></script>
</body>
</html>
