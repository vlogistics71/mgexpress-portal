<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver Applications | MG Express Dispatch</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#17221e}.topbar{background:#064f3b;color:#fff}.topbar-inner{max-width:1180px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px}.brand span{color:#ff665c}.container{max-width:1180px;margin:auto;padding:34px 22px 70px}.eyebrow{color:#b52a2d;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:900}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.heading h1{margin:7px 0 5px;font-size:36px}.subhead{margin:0;color:#69736f}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}.toolbar input{flex:1;min-width:230px;padding:12px 14px;border:1px solid #ccd6d1;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 16px;background:#064f3b;color:#fff;font-weight:800;cursor:pointer}.count{margin-bottom:14px;color:#65706b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #dfe7e3;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(20,40,30,.05)}.card h2{margin:0 0 4px;font-size:21px}.meta{color:#69736f;font-size:13px;margin-bottom:15px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 16px}.detail{font-size:13px}.detail b{display:block;color:#064f3b;margin-bottom:2px}.notes{margin-top:14px;padding-top:12px;border-top:1px solid #e6ece9;white-space:pre-wrap;font-size:12px;line-height:1.5;color:#58625e}.contact{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.contact a{padding:9px 12px;border-radius:10px;background:#eef5f1;color:#064f3b;text-decoration:none;font-size:13px;font-weight:800}.empty{padding:32px;background:#fff;border:1px dashed #cbd6d0;border-radius:18px;color:#6d7772;text-align:center}.error{padding:14px;border-radius:12px;background:#fff0f0;color:#9b2929;margin-bottom:16px}.hidden{display:none}@media(max-width:720px){.heading{align-items:start;flex-direction:column}.heading h1{font-size:29px}.grid{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr 1fr}.container{padding:25px 14px 55px}.topbar-inner{padding:16px 14px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand">MG <span>EXPRESS</span> DISPATCH</div><div id="staffEmail"></div></div></header>
  <main class="container">
    <section class="heading"><div><div class="eyebrow">Drivers</div><h1>Driver Applications</h1><p class="subhead">Applications submitted from the MG Express website.</p></div><a class="btn" href="/driver.html" style="text-decoration:none">← Driver Availability</a></section>
    <div class="toolbar"><input id="search" type="search" placeholder="Search name, city, vehicle, work area"><button class="btn" id="refresh" type="button">Refresh</button></div>
    <div id="error" class="error hidden"></div><div id="count" class="count">Loading applications…</div><section id="grid" class="grid"><div class="empty">Loading applications…</div></section>
  </main>
  <script>
    const client = supabase.createClient('https://dczlucwfjayymlwbzzdi.supabase.co','sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI');
    window.mgDispatchClient = client;
    const state={items:[]};
    const grid=document.getElementById('grid'),count=document.getElementById('count'),search=document.getElementById('search'),errorBox=document.getElementById('error');
    function esc(v){const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
    function noteText(row){return String(row.notes||row.internal_notes||row.dispatch_notes||'')}
    function getLine(text,label){const line=text.split('\n').find(x=>x.toLowerCase().startsWith(label.toLowerCase()+':'));return line?line.slice(line.indexOf(':')+1).trim():''}
    function isApplication(row){return noteText(row).includes('[DRIVER_APPLICATION]')||String(row.status||'').toLowerCase()==='applicant'}
    function render(){const q=search.value.trim().toLowerCase();const rows=state.items.filter(row=>{if(!q)return true;return JSON.stringify(row).toLowerCase().includes(q)});count.textContent=`${rows.length} application${rows.length===1?'':'s'}`;if(!rows.length){grid.innerHTML='<div class="empty">No driver applications found.</div>';return}grid.innerHTML=rows.map(row=>{const notes=noteText(row);const name=row.full_name||row.display_name||row.name||'Applicant';const phone=row.phone||row.mobile_phone||'';const residence=row.current_area||row.area||row.city||getLine(notes,'Residence');const vehicle=row.vehicle_make_model||getLine(notes,'Vehicle');const type=row.vehicle_type||row.vehicle||getLine(notes,'Vehicle Type');const area=row.service_area||getLine(notes,'Preferred Work Area');const availability=getLine(notes,'Availability');const experience=getLine(notes,'Courier / Delivery Experience');const license=getLine(notes,"Valid Driver's License");const insurance=getLine(notes,'Current Auto Insurance');const submitted=getLine(notes,'Submitted');const applicantNotes=getLine(notes,'Applicant Notes');return `<article class="card"><h2>${esc(name)}</h2><div class="meta">${submitted?`Submitted ${esc(new Date(submitted).toLocaleString())}`:'Website application'}</div><div class="detail-grid"><div class="detail"><b>Residence</b>${esc(residence||'—')}</div><div class="detail"><b>Preferred Area</b>${esc(area||'—')}</div><div class="detail"><b>Vehicle Type</b>${esc(type||'—')}</div><div class="detail"><b>Vehicle</b>${esc(vehicle||'—')}</div><div class="detail"><b>Availability</b>${esc(availability||'—')}</div><div class="detail"><b>Experience</b>${esc(experience||'—')}</div><div class="detail"><b>Valid License</b>${esc(license||'—')}</div><div class="detail"><b>Auto Insurance</b>${esc(insurance||'—')}</div></div>${applicantNotes?`<div class="notes"><b>Applicant Notes</b><br>${esc(applicantNotes)}</div>`:''}<div class="contact">${phone?`<a href="tel:${esc(phone)}">Call ${esc(phone)}</a>`:''}${row.email?`<a href="mailto:${esc(row.email)}">Email ${esc(row.email)}</a>`:''}</div></article>`}).join('')}
    async function load(){errorBox.classList.add('hidden');grid.innerHTML='<div class="empty">Loading applications…</div>';const {data:{session}}=await client.auth.getSession();if(!session){location.replace('/index.html');return}document.getElementById('staffEmail').textContent=session.user?.email||'';const {data,error}=await client.from('drivers').select('*').order('created_at',{ascending:false});if(error){errorBox.textContent=error.message;errorBox.classList.remove('hidden');grid.innerHTML='<div class="empty">Unable to load applications.</div>';return}state.items=(data||[]).filter(isApplication);render();window.dispatchEvent(new CustomEvent('mg-dispatch-ready',{detail:{email:session.user?.email||''}}))}
    search.addEventListener('input',render);document.getElementById('refresh').addEventListener('click',load);load();
  </script>
  <script src="/dispatch-menu.js"></script>
</body>
</html>
