<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG Express Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f8f6;
      color: #17221e;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 520px;
      background: white;
      border: 1px solid #dfe8e4;
      border-radius: 24px;
      padding: 34px 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .brand {
      color: #064f3b;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 16px;
    }

    .brand span {
      color: #ff665c;
    }

    .subtitle {
      color: #66736e;
      font-size: 18px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 25px;
    }

    label {
      display: block;
      font-weight: 800;
      margin: 17px 0 7px;
    }

    input {
      width: 100%;
      min-height: 56px;
      border: 1px solid #ccd8d3;
      border-radius: 13px;
      padding: 13px 15px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #087455;
      box-shadow: 0 0 0 3px rgba(8,116,85,.12);
    }

    button {
      width: 100%;
      min-height: 56px;
      margin-top: 24px;
      border: 0;
      border-radius: 13px;
      background: #087455;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
    }

    .text-button {
      min-height: auto;
      margin-top: 14px;
      padding: 6px;
      background: transparent;
      color: #087455;
      font-size: 15px;
      text-decoration: underline;
    }

    .form-copy {
      color: #66736e;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .back-button {
      background: #edf7f3;
      color: #06543e;
      margin-top: 10px;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #9b2929;
    }

    .info {
      display: block;
      background: #edf7f3;
      color: #06543e;
    }

    .hidden { display: none; }

    .mfa-copy {
      color: #66736e;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .help {
      color: #68756f;
      text-align: center;
      margin-top: 22px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">MG EXPRESS <span>PORTAL</span></div>
    <div class="subtitle">Secure customer, driver and dispatch access</div>

    <h1>Sign in</h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="signInButton" type="submit">Sign In</button>
      <button class="text-button" id="forgotPasswordBtn" type="button">Forgot password?</button>
    </form>

    <form id="recoveryRequestForm" class="hidden">
      <div class="form-copy">Enter your login email and we’ll send you a secure password-reset link.</div>
      <label for="recoveryEmail">Login email</label>
      <input id="recoveryEmail" type="email" autocomplete="email" required>
      <button id="sendRecoveryBtn" type="submit">Send Reset Email</button>
      <button class="back-button" id="backToLoginBtn" type="button">Back to Sign In</button>
    </form>

    <form id="passwordResetForm" class="hidden">
      <div class="form-copy">Create a new password for your MG Express account.</div>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
      <button id="savePasswordBtn" type="submit">Save New Password</button>
    </form>

    <form id="mfaForm" class="hidden">
      <div class="mfa-copy">Open your authenticator app and enter the 6-digit code.</div>
      <label for="mfaCode">Authenticator code</label>
      <input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      <button id="mfaButton" type="submit">Verify Code</button>
    </form>

    <div id="message" class="message"></div>

    <div class="help">
      Need an account?<br>
      Contact MG Express Dispatch.
    </div>
  </main>

  <script>
    const client = supabase.createClient(
      "https://dczlucwfjayymlwbzzdi.supabase.co",
      "sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI"
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("signInButton");
    const message = document.getElementById("message");
    const mfaForm = document.getElementById("mfaForm");
    const mfaButton = document.getElementById("mfaButton");
    const recoveryRequestForm = document.getElementById("recoveryRequestForm");
    const passwordResetForm = document.getElementById("passwordResetForm");
    const sendRecoveryBtn = document.getElementById("sendRecoveryBtn");
    const savePasswordBtn = document.getElementById("savePasswordBtn");
    let pendingMfaFactorId = "";
    let mfaResolve = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function showOnly(target) {
      [form, mfaForm, recoveryRequestForm, passwordResetForm].forEach(item => {
        item.classList.toggle("hidden", item !== target);
      });
    }

    document.getElementById("forgotPasswordBtn").addEventListener("click", function () {
      document.getElementById("recoveryEmail").value =
        document.getElementById("email").value.trim();
      showOnly(recoveryRequestForm);
      showMessage("Enter your email to receive a reset link.", "info");
      document.getElementById("recoveryEmail").focus();
    });

    document.getElementById("backToLoginBtn").addEventListener("click", function () {
      showOnly(form);
      message.className = "message";
    });

    recoveryRequestForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const email = document.getElementById("recoveryEmail").value.trim();
      sendRecoveryBtn.disabled = true;
      sendRecoveryBtn.textContent = "Sending…";

      try {
        const result = await client.auth.resetPasswordForEmail(email, {
          redirectTo: location.origin + "/index.html?recovery=1"
        });
        if (result.error) throw result.error;
        showMessage(
          "If that email belongs to an MG Express account, a password-reset link has been sent. Check your inbox and spam folder.",
          "info"
        );
      } catch (error) {
        showMessage(error.message || "Unable to send the reset email.", "error");
      } finally {
        sendRecoveryBtn.disabled = false;
        sendRecoveryBtn.textContent = "Send Reset Email";
      }
    });

    passwordResetForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 12) {
        showMessage("Use at least 12 characters for your new password.", "error");
        return;
      }
      if (password !== confirmation) {
        showMessage("The two passwords do not match.", "error");
        return;
      }

      savePasswordBtn.disabled = true;
      savePasswordBtn.textContent = "Saving…";
      try {
        const result = await client.auth.updateUser({ password });
        if (result.error) throw result.error;
        await client.auth.signOut();
        history.replaceState({}, "", "/index.html");
        showOnly(form);
        document.getElementById("password").value = "";
        showMessage("Password updated. Sign in with your new password.", "info");
      } catch (error) {
        showMessage(error.message || "Unable to update the password.", "error");
      } finally {
        savePasswordBtn.disabled = false;
        savePasswordBtn.textContent = "Save New Password";
      }
    });

    client.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") {
        showOnly(passwordResetForm);
        showMessage("Reset link verified. Choose your new password.", "info");
        document.getElementById("newPassword").focus();
      }
    });

    async function requireMfaIfEnrolled() {
      const aal = await client.auth.mfa.getAuthenticatorAssuranceLevel();
      if (aal.error) throw aal.error;

      if (aal.data.currentLevel !== "aal1" || aal.data.nextLevel !== "aal2") {
        return;
      }

      const factors = await client.auth.mfa.listFactors();
      if (factors.error) throw factors.error;
      const factor = (factors.data.totp || []).find(item => item.status === "verified");
      if (!factor) return;

      pendingMfaFactorId = factor.id;
      showOnly(mfaForm);
      document.getElementById("mfaCode").focus();
      showMessage("Password accepted. Complete two-step verification.", "info");

      await new Promise((resolve) => {
        mfaResolve = resolve;
      });
    }

    mfaForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const code = document.getElementById("mfaCode").value.replace(/\D/g, "");
      if (code.length !== 6 || !pendingMfaFactorId) {
        showMessage("Enter the 6-digit code from your authenticator app.", "error");
        return;
      }

      mfaButton.disabled = true;
      mfaButton.textContent = "Verifying…";
      try {
        const challenge = await client.auth.mfa.challenge({ factorId: pendingMfaFactorId });
        if (challenge.error) throw challenge.error;
        const result = await client.auth.mfa.verify({
          factorId: pendingMfaFactorId,
          challengeId: challenge.data.id,
          code
        });
        if (result.error) throw result.error;

        showMessage("Verified. Opening dispatch…", "info");
        const resolve = mfaResolve;
        mfaResolve = null;
        pendingMfaFactorId = "";
        if (resolve) resolve();
      } catch (error) {
        showMessage(error.message || "That code could not be verified.", "error");
      } finally {
        mfaButton.disabled = false;
        mfaButton.textContent = "Verify Code";
      }
    });

    async function sendUserToPortal(userId) {
      const profileResult = await client
        .from("profiles")
        .select("role")
        .eq("id", userId)
        .maybeSingle();

      if (profileResult.error) {
        showMessage(profileResult.error.message, "error");
        return;
      }

      if (!profileResult.data) {
        showMessage(
          "Your login does not have a portal profile. Contact MG Express Dispatch.",
          "error"
        );
        return;
      }

      const role = String(profileResult.data.role || "").toLowerCase();

      if (role === "driver") {
        location.replace("/driver.html");
        return;
      }

      if (
        role === "admin" ||
        role === "staff" ||
        role === "dispatcher"
      ) {
        try {
          await requireMfaIfEnrolled();
        } catch (error) {
          showMessage(error.message || "Unable to verify two-step security.", "error");
          return;
        }
        location.replace("/dashboard.html");
        return;
      }

      if (role === "customer") {
        location.replace("/customer.html");
        return;
      }

      showMessage(
        "Your account role is not recognized: " + role,
        "error"
      );
    }

    async function checkExistingSession() {
      if (new URLSearchParams(location.search).get("recovery") === "1") {
        return;
      }

      const sessionResult = await client.auth.getSession();
      const session = sessionResult.data.session;

      if (session) {
        showMessage("Opening your MG Express portal…", "info");
        await sendUserToPortal(session.user.id);
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing In…";
      showMessage("Checking your account…", "info");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const result = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (result.error) {
        showMessage(result.error.message, "error");
        button.disabled = false;
        button.textContent = "Sign In";
        return;
      }

      await sendUserToPortal(result.data.user.id);
    });

    checkExistingSession();
  </script>
</body>
</html>
