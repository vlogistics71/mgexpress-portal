<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG Express Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    :root {
      --dark: #064f3b;
      --green: #087455;
      --ink: #202824;
      --muted: #68746f;
      --danger: #9b2929;
    }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background-color: #263c34;
      background-image:
        linear-gradient(rgba(13, 27, 22, .22), rgba(13, 27, 22, .30)),
        url("https://migenteexpress.com/assets/mg-express-night-mural-team.webp");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .login-card {
      width: min(70vw, 300px);
      padding: 10px 16px 11px;
      background: #fff;
      border-radius: 23px;
      box-shadow: 0 20px 65px rgba(0, 0, 0, .24);
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin: 0 0 4px;
    }
    .logo {
      display: block;
      width: 118px;
      height: auto;
      max-height: 96px;
      object-fit: contain;
    }
    .portal-label {
      margin: 0 0 6px;
      color: var(--dark);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-weight: 800;
      text-align: center;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: -.03em;
      font-weight: 700;
    }
    .subtitle {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }
    label {
      display: block;
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 500;
    }
    input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 10px 12px;
      border: 1px solid #cdd4d4;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8, 116, 85, .14);
    }
    .field { margin-bottom: 8px; }
    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: .65; cursor: default; }
    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 45px;
      min-width: 112px;
      max-width: 100%;
      margin-top: 2px;
      padding: 8px 14px;
      border: 1.5px solid var(--green);
      border-radius: 10px;
      background: #fff;
      color: var(--green);
      font-size: 18px;
      font-weight: 500;
      transition: background .15s ease, color .15s ease;
    }
    .primary-button:hover,
    .primary-button:focus-visible {
      background: var(--green);
      color: #fff;
    }
    .text-button {
      display: block;
      width: fit-content;
      margin: 8px 0 0;
      padding: 5px 0;
      border: 0;
      background: transparent;
      color: var(--green);
      font-size: 12px;
      text-decoration: underline;
      font-weight: 600;
    }
    .secondary-button {
      display: block;
      max-width: 100%;
      min-height: 38px;
      margin-top: 9px;
      padding: 7px 11px;
      border: 1px solid #cbded5;
      border-radius: 9px;
      background: #edf7f3;
      color: var(--dark);
      font-size: 13px;
      font-weight: 700;
    }
    .form-copy, .mfa-copy {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.45;
      font-size: 13px;
    }
    .message {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .error { display: block; background: #fff0f0; color: var(--danger); }
    .info { display: block; background: #edf7f3; color: var(--dark); }
    .hidden { display: none; }
    .help {
      margin: 8px 0 0;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
      font-size: 12px;
    }
    @media (max-width: 600px) {
      body {
        background-image:
          linear-gradient(rgba(13, 27, 22, .20), rgba(13, 27, 22, .29)),
          url("https://migenteexpress.com/assets/field-photo-01-v2.jpg");
        background-position: center center;
        background-attachment: scroll;
      }
      .login-card {
        width: min(65vw, 265px);
        padding: 8px 14px 9px;
      }
      .logo { width: 106px; }
    }
    @media (max-height: 640px) {
      body { padding-top: 18px; padding-bottom: 18px; }
      .login-card { padding-top: 10px; padding-bottom: 11px; }
      .logo { width: 106px; }
      .portal-label { margin-bottom: 6px; }
      .subtitle { margin-bottom: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .primary-button { transition: none; }
    }
  </style>
</head>


<body>
  <main class="login-card">
    <div class="logo-wrap">
      <img class="logo" src="https://migenteexpress.com/assets/mg-express-logo-2026.jpg" alt="MG Express">
    </div>
    <p class="portal-label">Dispatch Portal</p>
    <h1>Login</h1>
    <p class="subtitle">Secure access to MG Express dispatch.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary-button" id="signInButton" type="submit">Sign In</button>
      <button class="text-button" id="forgotPasswordBtn" type="button">Forgot password?</button>
    </form>

    <form id="recoveryRequestForm" class="hidden">
      <div class="form-copy">Enter your login email and we’ll send you a secure password-reset link.</div>
      <div class="field">
        <label for="recoveryEmail">Login email</label>
        <input id="recoveryEmail" type="email" autocomplete="email" required>
      </div>
      <button class="primary-button" id="sendRecoveryBtn" type="submit">Send Reset Email</button>
      <button class="secondary-button" id="backToLoginBtn" type="button">Back to Sign In</button>
    </form>

    <form id="passwordResetForm" class="hidden">
      <div class="form-copy">Create a new password for your MG Express account.</div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
      </div>
      <button class="primary-button" id="savePasswordBtn" type="submit">Save New Password</button>
    </form>

    <form id="mfaForm" class="hidden">
      <div class="mfa-copy">Open your authenticator app and enter the 6-digit code.</div>
      <div class="field">
        <label for="mfaCode">Authenticator code</label>
        <input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
      </div>
      <button class="primary-button" id="mfaButton" type="submit">Verify Code</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div class="help">Need an account? Contact MG Express Dispatch.</div>
  </main>

  <script>
    const client = supabase.createClient(
      "https://dczlucwfjayymlwbzzdi.supabase.co",
      "sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI"
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("signInButton");
    const message = document.getElementById("message");
    const mfaForm = document.getElementById("mfaForm");
    const mfaButton = document.getElementById("mfaButton");
    const recoveryRequestForm = document.getElementById("recoveryRequestForm");
    const passwordResetForm = document.getElementById("passwordResetForm");
    const sendRecoveryBtn = document.getElementById("sendRecoveryBtn");
    const savePasswordBtn = document.getElementById("savePasswordBtn");
    let pendingMfaFactorId = "";
    let mfaResolve = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function showOnly(target) {
      [form, mfaForm, recoveryRequestForm, passwordResetForm].forEach(item => {
        item.classList.toggle("hidden", item !== target);
      });
    }

    document.getElementById("forgotPasswordBtn").addEventListener("click", function () {
      document.getElementById("recoveryEmail").value =
        document.getElementById("email").value.trim();
      showOnly(recoveryRequestForm);
      showMessage("Enter your email to receive a reset link.", "info");
      document.getElementById("recoveryEmail").focus();
    });

    document.getElementById("backToLoginBtn").addEventListener("click", function () {
      showOnly(form);
      message.className = "message";
    });

    recoveryRequestForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const email = document.getElementById("recoveryEmail").value.trim();
      sendRecoveryBtn.disabled = true;
      sendRecoveryBtn.textContent = "Sending…";

      try {
        const result = await client.auth.resetPasswordForEmail(email, {
          redirectTo: location.origin + "/index.html?recovery=1"
        });
        if (result.error) throw result.error;
        showMessage(
          "If that email belongs to an MG Express account, a password-reset link has been sent. Check your inbox and spam folder.",
          "info"
        );
      } catch (error) {
        showMessage(error.message || "Unable to send the reset email.", "error");
      } finally {
        sendRecoveryBtn.disabled = false;
        sendRecoveryBtn.textContent = "Send Reset Email";
      }
    });

    passwordResetForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 12) {
        showMessage("Use at least 12 characters for your new password.", "error");
        return;
      }
      if (password !== confirmation) {
        showMessage("The two passwords do not match.", "error");
        return;
      }

      savePasswordBtn.disabled = true;
      savePasswordBtn.textContent = "Saving…";
      try {
        const result = await client.auth.updateUser({ password });
        if (result.error) throw result.error;
        await client.auth.signOut();
        history.replaceState({}, "", "/index.html");
        showOnly(form);
        document.getElementById("password").value = "";
        showMessage("Password updated. Sign in with your new password.", "info");
      } catch (error) {
        showMessage(error.message || "Unable to update the password.", "error");
      } finally {
        savePasswordBtn.disabled = false;
        savePasswordBtn.textContent = "Save New Password";
      }
    });

    client.auth.onAuthStateChange(function (event) {
      if (event === "PASSWORD_RECOVERY") {
        showOnly(passwordResetForm);
        showMessage("Reset link verified. Choose your new password.", "info");
        document.getElementById("newPassword").focus();
      }
    });

    async function requireMfaIfEnrolled() {
      const aal = await client.auth.mfa.getAuthenticatorAssuranceLevel();
      if (aal.error) throw aal.error;

      if (aal.data.currentLevel !== "aal1" || aal.data.nextLevel !== "aal2") {
        return;
      }

      const factors = await client.auth.mfa.listFactors();
      if (factors.error) throw factors.error;
      const factor = (factors.data.totp || []).find(item => item.status === "verified");
      if (!factor) return;

      pendingMfaFactorId = factor.id;
      showOnly(mfaForm);
      document.getElementById("mfaCode").focus();
      showMessage("Password accepted. Complete two-step verification.", "info");

      await new Promise((resolve) => {
        mfaResolve = resolve;
      });
    }

    mfaForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      const code = document.getElementById("mfaCode").value.replace(/\D/g, "");
      if (code.length !== 6 || !pendingMfaFactorId) {
        showMessage("Enter the 6-digit code from your authenticator app.", "error");
        return;
      }

      mfaButton.disabled = true;
      mfaButton.textContent = "Verifying…";
      try {
        const challenge = await client.auth.mfa.challenge({ factorId: pendingMfaFactorId });
        if (challenge.error) throw challenge.error;
        const result = await client.auth.mfa.verify({
          factorId: pendingMfaFactorId,
          challengeId: challenge.data.id,
          code
        });
        if (result.error) throw result.error;

        showMessage("Verified. Opening dispatch…", "info");
        const resolve = mfaResolve;
        mfaResolve = null;
        pendingMfaFactorId = "";
        if (resolve) resolve();
      } catch (error) {
        showMessage(error.message || "That code could not be verified.", "error");
      } finally {
        mfaButton.disabled = false;
        mfaButton.textContent = "Verify Code";
      }
    });

    async function sendUserToPortal(userId) {
      const profileResult = await client
        .from("profiles")
        .select("role")
        .eq("id", userId)
        .maybeSingle();

      if (profileResult.error) {
        showMessage(profileResult.error.message, "error");
        return;
      }

      if (!profileResult.data) {
        showMessage(
          "Your login does not have a portal profile. Contact MG Express Dispatch.",
          "error"
        );
        return;
      }

      const role = String(profileResult.data.role || "").toLowerCase();

      if (role === "driver") {
        // Driver accounts do not use dispatch MFA. Clear the session on the
        // dispatch origin before sending the driver to the separate portal.
        await client.auth.signOut({ scope: "local" });
        localStorage.clear();
        sessionStorage.clear();
        location.replace("https://drivers.migenteexpress.com/");
        return;
      }

      if (
        role === "admin" ||
        role === "staff" ||
        role === "dispatcher"
      ) {
        try {
          await requireMfaIfEnrolled();
        } catch (error) {
          showMessage(error.message || "Unable to verify two-step security.", "error");
          return;
        }
        location.replace("/dashboard.html");
        return;
      }

      if (role === "customer") {
        location.replace("/customer.html");
        return;
      }

      showMessage(
        "Your account role is not recognized: " + role,
        "error"
      );
    }

    async function checkExistingSession() {
      if (new URLSearchParams(location.search).get("recovery") === "1") {
        return;
      }

      const sessionResult = await client.auth.getSession();
      const session = sessionResult.data.session;

      if (session) {
        showMessage("Opening your MG Express portal…", "info");
        await sendUserToPortal(session.user.id);
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing In…";
      showMessage("Checking your account…", "info");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const result = await client.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (result.error) {
        showMessage(result.error.message, "error");
        button.disabled = false;
        button.textContent = "Sign In";
        return;
      }

      await sendUserToPortal(result.data.user.id);
    });

    checkExistingSession();
  </script>
</body>
</html>
