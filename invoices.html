<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MG Express Invoices</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --dark-green: #064f3b;
      --green: #087455;
      --light-green: #e7f5ef;
      --coral: #ff665c;
      --background: #f3f8f6;
      --white: #ffffff;
      --ink: #17221e;
      --muted: #68756f;
      --line: #dfe8e4;
      --danger: #9b2929;
      --danger-bg: #fff0f0;
      --warning: #946000;
      --warning-bg: #fff5d8;
      --blue: #245d9c;
      --blue-bg: #eaf3ff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--ink);
    }

    body.modal-open {
      overflow: hidden;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 20px;
      background: var(--dark-green);
      color: white;
    }

    .topbar-inner {
      position: relative;
      width: min(1050px, 100%);
      min-height: 75px;
      margin: auto;
      padding-right: 82px;
    }

    .brand {
      font-size: clamp(21px, 5.8vw, 30px);
      font-weight: 900;
      line-height: 1.08;
    }

    .brand span {
      color: var(--coral);
    }

    .staff-email {
      margin-top: 9px;
      font-size: 14px;
      opacity: .84;
      overflow-wrap: anywhere;
    }


    .container {
      width: min(1050px, 100%);
      margin: auto;
      padding: 28px 18px 80px;
    }

    .heading-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 17px;
    }

    h1 {
      margin: 0;
      font-size: clamp(39px, 8vw, 55px);
      line-height: 1.03;
    }

    .refresh-button {
      min-height: 52px;
      padding: 13px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--dark-green);
      font-weight: 900;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 13px;
    }

    .stat-card {
      min-width: 0;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: white;
      box-shadow: 0 7px 23px rgba(0, 0, 0, .04);
    }

    .stat-number {
      color: var(--green);
      font-size: 29px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .stat-card.warning .stat-number {
      color: var(--warning);
    }

    .stat-card.danger .stat-number {
      color: var(--danger);
    }

    .stat-label {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      gap: 12px;
      margin-top: 22px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: white;
    }

    .toolbar input,
    .toolbar select {
      width: 100%;
      min-height: 51px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      color: var(--ink);
    }

    .message {
      margin-top: 18px;
      padding: 15px;
      border-radius: 14px;
      line-height: 1.45;
    }

    .message.error {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .message.success {
      background: var(--light-green);
      color: var(--dark-green);
    }

    .invoice-list {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .invoice-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: white;
      box-shadow: 0 7px 24px rgba(0, 0, 0, .04);
    }

    .invoice-main {
      display: grid;
      grid-template-columns:
        minmax(150px, .8fr)
        minmax(0, 1.3fr)
        minmax(125px, .65fr)
        minmax(125px, .65fr);
      gap: 15px;
      align-items: center;
      padding: 19px;
    }

    .invoice-number {
      color: var(--dark-green);
      font-size: 19px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .job-number {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .customer-name {
      font-size: 16px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .customer-email {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .amount {
      color: var(--dark-green);
      font-size: 21px;
      font-weight: 900;
    }

    .due-date {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-width: 82px;
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--warning-bg);
      color: var(--warning);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .status-pill.paid {
      background: var(--light-green);
      color: var(--green);
    }

    .status-pill.overdue {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .invoice-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 14px 19px 19px;
      border-top: 1px solid var(--line);
    }

    .action-button {
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      color: var(--dark-green);
      font-weight: 900;
    }

    .action-button.primary {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    .action-button.warning {
      border-color: #efd58c;
      background: var(--warning-bg);
      color: var(--warning);
    }

    .action-button.danger {
      border-color: #efc7c7;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .empty {
      margin-top: 20px;
      padding: 32px 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      color: var(--muted);
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 700;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(8, 25, 20, .62);
      opacity: 0;
      visibility: hidden;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: min(590px, 100%);
      max-height: 92vh;
      overflow-y: auto;
      padding: 21px;
      border-radius: 22px;
      background: white;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
    }

    .modal-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .modal-heading h2 {
      margin: 0;
      color: var(--dark-green);
      font-size: 28px;
    }

    .modal-close {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      border: 0;
      border-radius: 13px;
      background: var(--background);
      color: var(--dark-green);
      font-size: 26px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 51px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      color: var(--ink);
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
      margin-top: 18px;
    }

    .save-button {
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      background: var(--green);
      color: white;
      font-weight: 900;
    }

    .cancel-button {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--dark-green);
      font-weight: 900;
    }

    .print-sheet {
      display: none;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .invoice-main {
        grid-template-columns: 1fr 1fr;
      }

      .invoice-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .heading-row {
        align-items: stretch;
        flex-direction: column;
      }

      .refresh-button {
        width: 100%;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .invoice-main {
        grid-template-columns: 1fr;
      }

      .invoice-actions {
        grid-template-columns: 1fr;
      }

      .modal-grid,
      .modal-actions {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }

    @media (max-width: 430px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding-left: 16px;
        padding-right: 16px;
      }

      .brand {
        font-size: 20px;
      }
    }

    @media print {
      body {
        background: white;
      }

      body * {
        visibility: hidden;
      }

      .print-sheet,
      .print-sheet * {
        visibility: visible;
      }

      .print-sheet {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        padding: 35px;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
      }

      .print-header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 25px;
        border-bottom: 3px solid #064f3b;
      }

      .print-brand {
        color: #064f3b;
        font-size: 29px;
        font-weight: 900;
      }

      .print-brand span {
        color: #ff665c;
      }

      .print-title {
        text-align: right;
      }

      .print-title h2 {
        margin: 0;
        font-size: 30px;
      }

      .print-section {
        margin-top: 25px;
      }

      .print-label {
        color: #555;
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .print-value {
        margin-top: 5px;
        font-size: 15px;
        line-height: 1.45;
      }

      .print-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
      }

      .print-table {
        width: 100%;
        margin-top: 25px;
        border-collapse: collapse;
      }

      .print-table th,
      .print-table td {
        padding: 13px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      .print-table th:last-child,
      .print-table td:last-child {
        text-align: right;
      }

      .print-total {
        margin-top: 20px;
        text-align: right;
        font-size: 24px;
        font-weight: 900;
      }

      .print-footer {
        margin-top: 45px;
        padding-top: 18px;
        border-top: 1px solid #ddd;
        color: #555;
        font-size: 12px;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        MG <span>EXPRESS</span> DISPATCH
      </div>

      <div
        class="staff-email"
        id="staffEmail"
      ></div>
    </div>
  </header>

  <main class="container">
    <div class="heading-row">
      <div>
        <div class="eyebrow">
          Customer billing and payment records
        </div>

        <h1>Invoices</h1>
      </div>

      <button
        class="refresh-button"
        id="refreshButton"
        type="button"
      >
        Refresh
      </button>
    </div>

    <section class="stats">
      <article class="stat-card">
        <div class="stat-number" id="totalInvoiced">
          $0.00
        </div>

        <div class="stat-label">
          Total Invoiced
        </div>
      </article>

      <article class="stat-card">
        <div class="stat-number" id="totalPaid">
          $0.00
        </div>

        <div class="stat-label">
          Paid
        </div>
      </article>

      <article class="stat-card warning">
        <div class="stat-number" id="totalUnpaid">
          $0.00
        </div>

        <div class="stat-label">
          Unpaid
        </div>
      </article>

      <article class="stat-card danger">
        <div class="stat-number" id="totalOverdue">
          $0.00
        </div>

        <div class="stat-label">
          Overdue
        </div>
      </article>
    </section>

    <section class="toolbar">
      <input
        id="searchInput"
        type="search"
        placeholder="Search invoice, customer, email or job number"
      >

      <select id="statusFilter">
        <option value="all">All Invoices</option>
        <option value="unpaid">Unpaid</option>
        <option value="paid">Paid</option>
        <option value="overdue">Overdue</option>
      </select>
    </section>

    <div
      class="message hidden"
      id="pageMessage"
    ></div>

    <section
      class="invoice-list"
      id="invoiceList"
    >
      <div class="empty">
        Loading invoices...
      </div>
    </section>
  </main>

  <div
    class="modal-overlay"
    id="editModalOverlay"
  >
    <section class="modal">
      <div class="modal-heading">
        <div>
          <div class="eyebrow">
            Update customer invoice
          </div>

          <h2>Edit Invoice</h2>
        </div>

        <button
          class="modal-close"
          id="closeEditModalButton"
          type="button"
        >
          ×
        </button>
      </div>

      <form id="editInvoiceForm">
        <input
          id="editInvoiceId"
          type="hidden"
        >

        <div class="modal-grid">
          <div class="field full">
            <label for="editInvoiceNumber">
              Invoice Number
            </label>

            <input
              id="editInvoiceNumber"
              disabled
            >
          </div>

          <div class="field">
            <label for="editAmount">
              Customer Amount
            </label>

            <input
              id="editAmount"
              type="number"
              min="0"
              step="0.01"
              required
            >
          </div>

          <div class="field">
            <label for="editDueDate">
              Due Date
            </label>

            <input
              id="editDueDate"
              type="date"
            >
          </div>

          <div class="field">
            <label for="editStatus">
              Payment Status
            </label>

            <select id="editStatus">
              <option value="unpaid">Unpaid</option>
              <option value="paid">Paid</option>
            </select>
          </div>

          <div class="field">
            <label for="editCustomerEmail">
              Customer Email
            </label>

            <input
              id="editCustomerEmail"
              type="email"
            >
          </div>
        </div>

        <div class="modal-actions">
          <button
            class="save-button"
            type="submit"
          >
            Save Changes
          </button>

          <button
            class="cancel-button"
            id="cancelEditButton"
            type="button"
          >
            Cancel
          </button>
        </div>

        <div
          class="message hidden"
          id="editMessage"
        ></div>
      </form>
    </section>
  </div>

  <section
    class="print-sheet"
    id="printSheet"
  ></section>

  <script src="/dispatch-menu.js"></script>

  <script>
    const client = supabase.createClient(
      "https://dczlucwfjayymlwbzzdi.supabase.co",
      "sb_publishable_kcv_a78ZyUxMo2neKUANdw_XN7eAMpI"
    );

    window.mgDispatchClient = client;

    const invoiceList =
      document.getElementById("invoiceList");

    const searchInput =
      document.getElementById("searchInput");

    const statusFilter =
      document.getElementById("statusFilter");

    const pageMessage =
      document.getElementById("pageMessage");

    const editModalOverlay =
      document.getElementById("editModalOverlay");

    const editInvoiceForm =
      document.getElementById("editInvoiceForm");

    const editMessage =
      document.getElementById("editMessage");

    let invoices = [];
    let jobsById = {};
    let invoiceRows = [];
    let invoiceRowsById = {};

    function escapeHtml(value) {
      const div =
        document.createElement("div");

      div.textContent =
        value ?? "";

      return div.innerHTML;
    }

    function money(value) {
      return Number(value || 0).toLocaleString(
        "en-US",
        {
          style: "currency",
          currency: "USD"
        }
      );
    }

    function cleanStatus(value) {
      return String(value || "unpaid")
        .trim()
        .toLowerCase()
        .replaceAll(" ", "_")
        .replaceAll("-", "_");
    }

    function resolveCustomerAmount(job, invoice) {
      const charge = Number(job?.customer_charge);
      if (Number.isFinite(charge)) {
        return charge;
      }

      const approved = Number(job?.approved_price);
      if (Number.isFinite(approved)) {
        return approved;
      }

      const invoiceAmount = Number(invoice?.amount);
      if (Number.isFinite(invoiceAmount)) {
        return invoiceAmount;
      }

      return 0;
    }

    function localDateString(date) {
      const year =
        date.getFullYear();

      const month =
        String(date.getMonth() + 1)
          .padStart(2, "0");

      const day =
        String(date.getDate())
          .padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function displayDate(value) {
      if (!value) {
        return "No due date";
      }

      const date =
        new Date(`${String(value).slice(0, 10)}T12:00:00`);

      if (
        Number.isNaN(date.getTime())
      ) {
        return String(value);
      }

      return date.toLocaleDateString(
        "en-US",
        {
          month: "short",
          day: "numeric",
          year: "numeric"
        }
      );
    }

    function setPageMessage(message, type) {
      pageMessage.textContent =
        message || "";

      pageMessage.className =
        message
          ? `message ${type || ""}`
          : "message hidden";
    }

    function setEditMessage(message, type) {
      editMessage.textContent =
        message || "";

      editMessage.className =
        message
          ? `message ${type || ""}`
          : "message hidden";
    }

    function isPaid(row) {
      return cleanStatus(
        row.payment_status ||
        row.status
      ) === "paid";
    }

    function isOverdue(row) {
      if (
        isPaid(row) ||
        !row.due_date
      ) {
        return false;
      }

      return (
        String(row.due_date).slice(0, 10) <
        localDateString(new Date())
      );
    }

    function invoiceStatus(row) {
      if (isPaid(row)) {
        return "paid";
      }

      if (isOverdue(row)) {
        return "overdue";
      }

      return "unpaid";
    }

    function getJob(invoice) {
      return (
        jobsById[
          String(invoice.job_id || "")
        ] || {}
      );
    }

    function combinedInvoice(invoice) {
      const job =
        getJob(invoice);

      return {
        ...invoice,

        job,

        display_customer_name:
          invoice.customer_name ||
          job.customer_name ||
          "Customer",

        display_customer_email:
          invoice.customer_email ||
          job.customer_email ||
          "",

        display_customer_phone:
          invoice.customer_phone ||
          job.customer_phone ||
          "",

        display_job_number:
          job.job_number ||
          "",

        display_pickup_address:
          job.pickup_address ||
          "",

        display_delivery_address:
          job.delivery_address ||
          "",

        display_vehicle_type:
          job.vehicle_type ||
          "",

        display_delivery_speed:
          job.delivery_speed ||
          "",

        display_package_type:
          job.package_type ||
          "Courier delivery",

        display_billing_notes:
          invoice.notes ||
          job.billing_notes ||
          ""
      };
    }

    function buildInvoiceRows() {
      const rows = [];
      const invoicedJobIds = new Set();

      invoices.forEach(invoice => {
        const combined = combinedInvoice(invoice);
        const jobId = String(invoice.job_id || "");
        if (jobId) {
          invoicedJobIds.add(jobId);
        }

        const amount = resolveCustomerAmount(combined.job, invoice);
        const paymentStatus = cleanStatus(
          combined.job?.payment_status ||
          invoice.payment_status ||
          invoice.status ||
          "unpaid"
        );

        rows.push({
          row_id: `invoice:${invoice.id}`,
          source: "invoice",
          invoice,
          job: combined.job || {},
          amount,
          payment_status: paymentStatus,
          due_date: invoice.due_date || null,
          created_at: invoice.created_at || combined.job?.created_at || null,
          display_customer_name: combined.display_customer_name,
          display_customer_email: combined.display_customer_email,
          display_customer_phone: combined.display_customer_phone,
          display_job_number: combined.display_job_number,
          display_pickup_address: combined.display_pickup_address,
          display_delivery_address: combined.display_delivery_address,
          display_vehicle_type: combined.display_vehicle_type,
          display_delivery_speed: combined.display_delivery_speed,
          display_package_type: combined.display_package_type,
          display_billing_notes: combined.display_billing_notes,
          display_invoice_number: invoice.invoice_number || "Invoice"
        });
      });

      Object.values(jobsById).forEach(job => {
        const jobId = String(job.id || "");
        if (!jobId || invoicedJobIds.has(jobId)) {
          return;
        }

        const amount = resolveCustomerAmount(job, null);
        if (!(amount > 0)) {
          return;
        }

        rows.push({
          row_id: `quote:${jobId}`,
          source: "quote",
          invoice: null,
          job,
          amount,
          payment_status: cleanStatus(job.payment_status || "unpaid"),
          due_date: null,
          created_at: job.updated_at || job.created_at || null,
          display_customer_name: job.customer_name || "Customer",
          display_customer_email: job.customer_email || "",
          display_customer_phone: job.customer_phone || "",
          display_job_number: job.job_number || "",
          display_pickup_address: job.pickup_address || "",
          display_delivery_address: job.delivery_address || "",
          display_vehicle_type: job.vehicle_type || "",
          display_delivery_speed: job.delivery_speed || "",
          display_package_type: job.package_type || "Courier delivery",
          display_billing_notes: job.billing_notes || "",
          display_invoice_number: `Job ${job.job_number || jobId}`
        });
      });

      rows.sort((a, b) => new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime());
      invoiceRows = rows;
      invoiceRowsById = {};
      rows.forEach(row => {
        invoiceRowsById[String(row.row_id)] = row;
      });
    }

    async function verifyUser() {
      const sessionResult =
        await client.auth.getSession();

      const session =
        sessionResult.data.session;

      if (!session) {
        location.replace("/index.html");
        return null;
      }

      const email =
        session.user.email || "";

      document
        .getElementById("staffEmail")
        .textContent = email;

      window.dispatchEvent(
        new CustomEvent("mg-dispatch-ready", {
          detail: {
            email
          }
        })
      );

      const profileResult =
        await client
          .from("profiles")
          .select("role")
          .eq("id", session.user.id)
          .maybeSingle();

      if (
        profileResult.error ||
        !profileResult.data
      ) {
        throw new Error(
          profileResult.error?.message ||
          "No MG Express profile was found."
        );
      }

      const role =
        cleanStatus(
          profileResult.data.role
        );

      if (
        ![
          "admin",
          "staff",
          "dispatcher"
        ].includes(role)
      ) {
        throw new Error(
          "This account does not have dispatch access."
        );
      }

      return session;
    }

    async function loadInvoices() {
      invoiceList.innerHTML = `
        <div class="empty">
          Loading invoices...
        </div>
      `;

      setPageMessage("", "");

      const invoiceResult =
        await client
          .from("invoices")
          .select("*")
          .order("created_at", {
            ascending: false
          });

      if (invoiceResult.error) {
        throw invoiceResult.error;
      }

      invoices =
        invoiceResult.data || [];

      const jobsResult =
        await client
          .from("quotes")
          .select("*")
          .order("created_at", {
            ascending: false
          });

      if (jobsResult.error) {
        throw jobsResult.error;
      }

      jobsById = {};
      (jobsResult.data || [])
        .forEach(job => {
          jobsById[
            String(job.id)
          ] = job;
        });

      buildInvoiceRows();

      updateTotals();
      renderInvoices();
    }

    function updateTotals() {
      const totalInvoiced =
        invoiceRows.reduce(
          (sum, row) =>
            sum + Number(row.amount || 0),
          0
        );

      const totalPaid =
        invoiceRows
          .filter(row => cleanStatus(row.payment_status) === "paid")
          .reduce(
            (sum, row) =>
              sum + Number(row.amount || 0),
            0
          );

      const totalUnpaid =
        invoiceRows
          .filter(row =>
            cleanStatus(row.payment_status) !== "paid"
          )
          .reduce(
            (sum, row) =>
              sum + Number(row.amount || 0),
            0
          );

      const totalOverdue =
        invoiceRows
          .filter(isOverdue)
          .reduce(
            (sum, row) =>
              sum + Number(row.amount || 0),
            0
          );

      document
        .getElementById("totalInvoiced")
        .textContent =
          money(totalInvoiced);

      document
        .getElementById("totalPaid")
        .textContent =
          money(totalPaid);

      document
        .getElementById("totalUnpaid")
        .textContent =
          money(totalUnpaid);

      document
        .getElementById("totalOverdue")
        .textContent =
          money(totalOverdue);
    }

    function visibleInvoices() {
      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const filter =
        statusFilter.value;

      return invoiceRows.filter(row => {

        const status =
          invoiceStatus(row);

        if (
          filter !== "all" &&
          status !== filter
        ) {
          return false;
        }

        if (!search) {
          return true;
        }

        return [
          row.display_invoice_number,
          String(row.job?.id || ""),
          row.display_customer_name,
          row.display_customer_email,
          row.display_customer_phone,
          row.display_job_number
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase()
          .includes(search);
      });
    }

    function renderInvoices() {
      const visible =
        visibleInvoices();

      if (!visible.length) {
        invoiceList.innerHTML = `
          <div class="empty">
            No invoices match your search or filter.
          </div>
        `;

        return;
      }

      invoiceList.innerHTML =
        visible
          .map(row => {

            const status =
              invoiceStatus(row);

            const isManagedInvoice = row.source === "invoice";

            const nextStatus =
              isPaid(row)
                ? "unpaid"
                : "paid";

            const statusButtonLabel =
              isPaid(row)
                ? "Mark Unpaid"
                : "Mark Paid";

            return `
              <article class="invoice-card">
                <div class="invoice-main">
                  <div>
                    <div class="invoice-number">
                      ${escapeHtml(
                        row.display_invoice_number ||
                        "Invoice"
                      )}
                    </div>

                    <div class="job-number">
                      ${
                        row.display_job_number
                          ? `Job ${escapeHtml(
                              row.display_job_number
                            )}`
                          : "No job number"
                      }
                    </div>
                  </div>

                  <div>
                    <div class="customer-name">
                      ${escapeHtml(
                        row.display_customer_name
                      )}
                    </div>

                    <div class="customer-email">
                      ${escapeHtml(
                        row.display_customer_email ||
                        "No email recorded"
                      )}
                    </div>
                  </div>

                  <div>
                    <div class="amount">
                      ${money(row.amount)}
                    </div>

                    <div class="due-date">
                      Date ${escapeHtml(
                        displayDate(row.created_at)
                      )}
                    </div>
                  </div>

                  <div>
                    <span class="status-pill ${status}">
                      ${escapeHtml(status)}
                    </span>
                  </div>
                </div>

                <div class="invoice-actions">
                  <button
                    class="action-button primary"
                    type="button"
                    data-action="print"
                    data-id="${escapeHtml(row.row_id)}"
                  >
                    Print Invoice
                  </button>

                  ${isManagedInvoice ? `
                    <button
                      class="action-button"
                      type="button"
                      data-action="edit"
                      data-id="${escapeHtml(row.row_id)}"
                    >
                      Edit
                    </button>

                    <button
                      class="action-button ${
                        nextStatus === "paid"
                          ? "warning"
                          : ""
                      }"
                      type="button"
                      data-action="status"
                      data-id="${escapeHtml(row.row_id)}"
                      data-status="${nextStatus}"
                    >
                      ${statusButtonLabel}
                    </button>

                    <button
                      class="action-button danger"
                      type="button"
                      data-action="delete"
                      data-id="${escapeHtml(row.row_id)}"
                    >
                      Delete
                    </button>
                  ` : ""}
                </div>
              </article>
            `;
          })
          .join("");
    }

    function findInvoice(id) {
      return (
        invoiceRowsById[
          String(id)
        ] || null
      );
    }

    function openEditModal(invoice) {
      document
        .getElementById("editInvoiceId")
        .value =
          invoice.id || "";

      document
        .getElementById("editInvoiceNumber")
        .value =
          invoice.invoice_number || "";

      document
        .getElementById("editAmount")
        .value =
          Number(invoice.amount || 0)
            .toFixed(2);

      document
        .getElementById("editDueDate")
        .value =
          invoice.due_date
            ? String(invoice.due_date).slice(0, 10)
            : "";

      document
        .getElementById("editStatus")
        .value =
          isPaid(invoice)
            ? "paid"
            : "unpaid";

      document
        .getElementById("editCustomerEmail")
        .value =
          invoice.customer_email ||
          getJob(invoice).customer_email ||
          "";

      setEditMessage("", "");

      editModalOverlay.classList.add(
        "open"
      );

      document.body.classList.add(
        "modal-open"
      );
    }

    function closeEditModal() {
      editModalOverlay.classList.remove(
        "open"
      );

      document.body.classList.remove(
        "modal-open"
      );

      setEditMessage("", "");
    }

    async function updateInvoiceStatus(
      invoiceId,
      newStatus
    ) {
      const result =
        await client
          .from("invoices")
          .update({
            payment_status:
              newStatus
          })
          .eq("id", invoiceId)
          .select("*")
          .maybeSingle();

      if (result.error) {
        throw result.error;
      }

      const index =
        invoices.findIndex(
          invoice =>
            String(invoice.id) ===
            String(invoiceId)
        );

      if (index >= 0) {
        invoices[index] =
          result.data;
      }

      buildInvoiceRows();
      updateTotals();
      renderInvoices();

      setPageMessage(
        newStatus === "paid"
          ? "Invoice marked paid."
          : "Invoice marked unpaid.",
        "success"
      );
    }

    async function deleteInvoice(invoiceId) {
      const confirmed =
        window.confirm(
          "Delete this invoice permanently?"
        );

      if (!confirmed) {
        return;
      }

      const result =
        await client
          .from("invoices")
          .delete()
          .eq("id", invoiceId);

      if (result.error) {
        throw result.error;
      }

      invoices =
        invoices.filter(
          invoice =>
            String(invoice.id) !==
            String(invoiceId)
        );

      buildInvoiceRows();
      updateTotals();
      renderInvoices();

      setPageMessage(
        "Invoice deleted.",
        "success"
      );
    }

    function printInvoice(row) {
      const invoice = row?.invoice || {};
      const combined = {
        display_customer_name: row?.display_customer_name || "Customer",
        display_customer_email: row?.display_customer_email || "",
        display_customer_phone: row?.display_customer_phone || "",
        display_job_number: row?.display_job_number || "",
        display_pickup_address: row?.display_pickup_address || "",
        display_delivery_address: row?.display_delivery_address || "",
        display_vehicle_type: row?.display_vehicle_type || "",
        display_delivery_speed: row?.display_delivery_speed || "",
        display_package_type: row?.display_package_type || "Courier service",
        display_billing_notes: row?.display_billing_notes || ""
      };

      const status =
        invoiceStatus(row || {});

      const amount = Number(row?.amount || 0);

      const printSheet =
        document.getElementById(
          "printSheet"
        );

      printSheet.innerHTML = `
        <div class="print-header">
          <div>
            <div class="print-brand">
              MG <span>EXPRESS</span>
            </div>

            <div style="margin-top:7px;">
              Professional Courier Services
            </div>
          </div>

          <div class="print-title">
            <h2>INVOICE</h2>

            <div style="margin-top:7px;">
              ${escapeHtml(
                row?.display_invoice_number ||
                invoice.invoice_number ||
                "Invoice"
              )}
            </div>

            <div style="margin-top:5px;">
              Status: ${escapeHtml(
                status.toUpperCase()
              )}
            </div>
          </div>
        </div>

        <div class="print-section print-grid">
          <div>
            <div class="print-label">
              Bill To
            </div>

            <div class="print-value">
              <strong>
                ${escapeHtml(
                  combined.display_customer_name
                )}
              </strong><br>

              ${escapeHtml(
                combined.display_customer_email
              )}<br>

              ${escapeHtml(
                combined.display_customer_phone
              )}
            </div>
          </div>

          <div>
            <div class="print-label">
              Invoice Details
            </div>

            <div class="print-value">
              Invoice Date:
              ${escapeHtml(
                displayDate(row?.created_at || invoice.created_at)
              )}<br>

              Due Date:
              ${escapeHtml(
                displayDate(row?.due_date || invoice.due_date)
              )}<br>

              Job Number:
              ${escapeHtml(
                combined.display_job_number ||
                "N/A"
              )}
            </div>
          </div>
        </div>

        <div class="print-section print-grid">
          <div>
            <div class="print-label">
              Pickup
            </div>

            <div class="print-value">
              ${escapeHtml(
                combined.display_pickup_address ||
                "Not recorded"
              )}
            </div>
          </div>

          <div>
            <div class="print-label">
              Delivery
            </div>

            <div class="print-value">
              ${escapeHtml(
                combined.display_delivery_address ||
                "Not recorded"
              )}
            </div>
          </div>
        </div>

        <table class="print-table">
          <thead>
            <tr>
              <th>Description</th>
              <th>Amount</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>
                ${escapeHtml(
                  combined.display_package_type ||
                  "Courier service"
                )}

                ${
                  combined.display_vehicle_type
                    ? `<br><small>
                        Vehicle:
                        ${escapeHtml(
                          combined.display_vehicle_type
                        )}
                      </small>`
                    : ""
                }

                ${
                  combined.display_delivery_speed
                    ? `<br><small>
                        Service:
                        ${escapeHtml(
                          combined.display_delivery_speed
                        )}
                      </small>`
                    : ""
                }
              </td>

              <td>
                ${money(amount)}
              </td>
            </tr>
          </tbody>
        </table>

        <div class="print-total">
          Total: ${money(amount)}
        </div>

        ${
          combined.display_billing_notes
            ? `
              <div class="print-section">
                <div class="print-label">
                  Notes
                </div>

                <div class="print-value">
                  ${escapeHtml(
                    combined.display_billing_notes
                  )}
                </div>
              </div>
            `
            : ""
        }

        <div class="print-footer">
          Thank you for choosing MG Express.
        </div>
      `;

      window.print();
    }

    invoiceList.addEventListener(
      "click",
      async function (event) {
        const button =
          event.target.closest(
            "[data-action]"
          );

        if (!button) {
          return;
        }

        const action =
          button.dataset.action;

        const invoiceId =
          button.dataset.id;

        const row =
          findInvoice(invoiceId);

        if (!row) {
          return;
        }

        button.disabled = true;

        try {
          if (action === "print") {
            printInvoice(row);
          }

          if (action === "edit") {
            if (row.source !== "invoice" || !row.invoice?.id) {
              setPageMessage("This row is sourced from a job record. Edit is available after an invoice record exists.", "info");
              return;
            }

            openEditModal(row.invoice);
          }

          if (action === "status") {
            if (row.source !== "invoice" || !row.invoice?.id) {
              setPageMessage("This row is sourced from a job record. Payment status is driven by the job payment field.", "info");
              return;
            }

            await updateInvoiceStatus(
              row.invoice.id,
              button.dataset.status
            );
          }

          if (action === "delete") {
            if (row.source !== "invoice" || !row.invoice?.id) {
              setPageMessage("Only saved invoice records can be deleted here.", "info");
              return;
            }

            await deleteInvoice(
              row.invoice.id
            );
          }
        } catch (error) {
          setPageMessage(
            error.message ||
            "Unable to update this invoice.",
            "error"
          );
        } finally {
          button.disabled = false;
        }
      }
    );

    editInvoiceForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        const invoiceId =
          document
            .getElementById("editInvoiceId")
            .value;

        const payload = {
          amount:
            Number(
              document
                .getElementById("editAmount")
                .value || 0
            ),

          due_date:
            document
              .getElementById("editDueDate")
              .value || null,

          payment_status:
            document
              .getElementById("editStatus")
              .value,

          customer_email:
            document
              .getElementById("editCustomerEmail")
              .value
              .trim()
        };

        const submitButton =
          editInvoiceForm.querySelector(
            'button[type="submit"]'
          );

        submitButton.disabled = true;

        setEditMessage(
          "Saving changes...",
          "success"
        );

        try {
          const result =
            await client
              .from("invoices")
              .update(payload)
              .eq("id", invoiceId)
              .select("*")
              .maybeSingle();

          if (result.error) {
            throw result.error;
          }

          const index =
            invoices.findIndex(
              invoice =>
                String(invoice.id) ===
                String(invoiceId)
            );

          if (index >= 0) {
            invoices[index] =
              result.data;
          }

          buildInvoiceRows();
          updateTotals();
          renderInvoices();

          setEditMessage(
            "Invoice updated.",
            "success"
          );

          setTimeout(
            closeEditModal,
            700
          );
        } catch (error) {
          setEditMessage(
            error.message ||
            "Unable to save invoice.",
            "error"
          );
        } finally {
          submitButton.disabled = false;
        }
      }
    );

    searchInput.addEventListener(
      "input",
      renderInvoices
    );

    statusFilter.addEventListener(
      "change",
      renderInvoices
    );

    document
      .getElementById("refreshButton")
      .addEventListener(
        "click",
        async function () {
          this.disabled = true;
          this.textContent =
            "Refreshing...";

          try {
            await loadInvoices();

            setPageMessage(
              "Invoices refreshed.",
              "success"
            );
          } catch (error) {
            setPageMessage(
              error.message ||
              "Unable to refresh invoices.",
              "error"
            );
          } finally {
            this.disabled = false;
            this.textContent =
              "Refresh";
          }
        }
      );

    document
      .getElementById("closeEditModalButton")
      .addEventListener(
        "click",
        closeEditModal
      );

    document
      .getElementById("cancelEditButton")
      .addEventListener(
        "click",
        closeEditModal
      );

    editModalOverlay.addEventListener(
      "click",
      function (event) {
        if (
          event.target ===
          editModalOverlay
        ) {
          closeEditModal();
        }
      }
    );

    document.addEventListener(
      "keydown",
      function (event) {
        if (event.key === "Escape") {
          closeEditModal();
        }
      }
    );

    function applyRouteFiltersFromQuery() {
      const params = new URLSearchParams(window.location.search || "");
      const jobFilter = String(params.get("job") || params.get("jobId") || "").trim();
      if (!jobFilter) {
        return;
      }

      searchInput.value = jobFilter;
      renderInvoices();
    }

    (async function startPage() {
      try {
        const session =
          await verifyUser();

        if (!session) {
          return;
        }

        await loadInvoices();
        applyRouteFiltersFromQuery();
      } catch (error) {
        invoiceList.innerHTML = `
          <div class="empty">
            ${escapeHtml(
              error.message ||
              "Unable to load invoices."
            )}
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
