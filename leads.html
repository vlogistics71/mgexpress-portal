<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MG Express Leads</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/assets/css/dispatch.css">
  <style>
    :root{--green:#064f3b;--red:#c9473d;--cream:#f7f1e5;--line:#dfe8e4}
    *{box-sizing:border-box} body{margin:0;background:#f5f7f6;color:#17221e;font-family:Arial,sans-serif}
    .topbar{background:var(--green);color:#fff}.topbar-inner{max-width:1200px;margin:auto;padding:18px 22px}.brand{font-size:22px;font-weight:900}.brand span{color:#ff665c}
    .container{max-width:1200px;margin:auto;padding:28px 20px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{color:#64736c;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.08em}h1{margin:6px 0 0;color:var(--green)}button{cursor:pointer}
    .primary{border:0;border-radius:12px;background:var(--green);color:#fff;padding:14px 18px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.04)}.card{padding:18px}.num{font-size:30px;font-weight:900;color:var(--green)}.label{font-size:13px;color:#65736d;font-weight:800;margin-top:4px}
    .toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;padding:15px;margin-bottom:16px}input,select,textarea{width:100%;border:1px solid #cfdad5;border-radius:10px;padding:12px;font:inherit;background:#fff}.lead{padding:16px;margin-bottom:10px;display:grid;grid-template-columns:2fr 1.1fr 1.2fr auto;gap:14px;align-items:center}.business{font-weight:900;color:var(--green);font-size:17px}.small{font-size:13px;color:#65736d;margin-top:4px}.badge{display:inline-block;border-radius:999px;padding:7px 10px;background:#e7f5ef;color:#087455;font-size:12px;font-weight:900}.actions{display:flex;gap:7px}.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-weight:800}.empty{text-align:center;padding:45px;color:#68756f}
    .notice{margin:0 0 16px;padding:13px 15px;border-radius:12px;background:#eef4f1;color:#40534b;font-weight:800}.notice.warning{background:#fff4d8;color:#765b12}.notice.success{background:#e7f5ef;color:#087455}
    .modal-bg{position:fixed;inset:0;background:rgba(8,25,20,.62);display:none;place-items:center;z-index:2000;padding:18px}.modal-bg.open{display:grid}.modal{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef4f1;border-radius:10px;width:42px;height:42px;font-size:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.full{grid-column:1/-1}label{font-size:12px;font-weight:900;color:#52615b;display:block;margin-bottom:5px}.form-actions{display:flex;gap:10px;margin-top:18px}.danger{color:#9b2929}.note{font-size:12px;color:#6b7872;margin-top:10px}
    @media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.lead{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.heading{align-items:flex-start}.actions{justify-content:flex-start}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><div><div class="brand">MG <span>EXPRESS</span> DISPATCH</div><div id="staffEmail"></div></div></div></header>
  <main class="container">
    <div class="heading"><div><div class="eyebrow">Sales pipeline & follow-ups</div><h1>Leads</h1></div><button class="primary" id="newLead">+ New Lead</button></div>
    <section class="stats">
      <div class="card"><div class="num" id="sNew">0</div><div class="label">New Leads</div></div>
      <div class="card"><div class="num" id="sFollow">0</div><div class="label">Follow-Ups Due</div></div>
      <div class="card"><div class="num" id="sQuote">0</div><div class="label">Quote Requested</div></div>
      <div class="card"><div class="num" id="sCustomer">0</div><div class="label">Converted Customers</div></div>
    </section>
    <div id="pageNotice" class="notice" hidden></div>
    <section class="toolbar panel">
      <input id="search" type="search" placeholder="Search business, contact, phone or email">
      <select id="statusFilter"><option value="all">All Statuses</option><option>New Lead</option><option>Contacted</option><option>Follow-Up</option><option>Quote Requested</option><option>Customer</option><option>Not Interested</option></select>
      <select id="industryFilter"><option value="all">All Industries</option></select>
    </section>
    <section id="list"><div class="panel empty">Loading leads...</div></section>
  </main>

  <div class="modal-bg" id="modalBg"><div class="modal">
    <div class="modal-head"><div><div class="eyebrow">Sales prospect</div><h2 id="modalTitle">New Lead</h2></div><button class="close" id="close" type="button">×</button></div>
    <form id="form"><input type="hidden" id="id"><div class="form-grid">
      <div><label>Business *</label><input id="business" required></div><div><label>Contact Person</label><input id="contact"></div>
      <div><label>Industry</label><input id="industry" placeholder="Law Firm, Property Management..."></div><div><label>Status</label><select id="status"><option>New Lead</option><option>Contacted</option><option>Follow-Up</option><option>Quote Requested</option><option>Customer</option><option>Not Interested</option></select></div>
      <div><label>Phone</label><input id="phone" type="tel"></div><div><label>Email</label><input id="email" type="email"></div>
      <div class="full"><label>Address</label><input id="address"></div><div><label>Last Contact</label><input id="lastContact" type="date"></div><div><label>Next Follow-Up</label><input id="nextFollowUp" type="date"></div>
      <div class="full"><label>Notes / Sales History</label><textarea id="notes" rows="4" placeholder="What they need, who you spoke with, best time to call, objections..."></textarea></div>
    </div><div class="form-actions"><button class="primary" type="submit">Save Lead</button><button class="mini" type="button" id="cancel">Cancel</button><button class="mini danger" type="button" id="deleteBtn" style="display:none">Delete</button></div><div class="note">Leads are saved to the MG Express database when the sales_leads table is installed.</div></form>
  </div></div>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/dispatch-menu.js"></script>
  <script src="/assets/js/leads.js"></script>
</body>
</html>
